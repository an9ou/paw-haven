<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>Paw Haven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Gloria+Hallelujah&family=Patrick+Hand&display=swap">
<style>
/* Layout: a 16:9 sketchbook page lying on a kraft desk (laptop first). Pencil frames are
   stretchable SVG data URIs generated at boot (--fr-*); colour is a coloured-pencil wash with
   light hatching, drifting a few px off the line. The crude crayon dogs are the joke. */
:root{
  --desk:#E6D7BF;          /* page chrome around the sketchbook */
  --desk-fg:#5B3D32;
  --paper:#FFFBF3;         /* sketchbook paper (fixed in both themes) */
  --dot:#E3D2BA;
  --ink:#5B3D32;           /* warm brown pencil */
  --graph:#A8968A;         /* graphite construction lines */
  --pink:#F28FA5;
  --w-yellow:#FFE3A1; --w-mint:#C8E9CF; --w-blue:#CBE0F4; --w-pink:#F9D0D9; --w-peach:#FCD8BC; --w-lilac:#E0D5F0; --w-cream:#FFF4DF;
  --m-hunger:#F4A262; --m-happy:#F2C744; --m-energy:#86B3EA; --m-clean:#86CFD6; --m-bond:#F28FA5;
  --muted:#8A7468;
  --font-hand:'Caveat','Patrick Hand','Comic Sans MS',cursive;
  --font-read:'Patrick Hand','Trebuchet MS',sans-serif;
  --font-scrawl:var(--font-hand);
  --hatch:repeating-linear-gradient(-58deg,rgba(255,255,255,.34) 0 1.6px,transparent 1.6px 5px);
  --ins:4px 3px/calc(100% - 7px) calc(100% - 7px) no-repeat;
  --wash:var(--paper);
  --fr:none;
  --barH:74px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --desk:#2b231e; --desk-fg:#E6D7BF; color-scheme:dark } }
:root[data-theme="dark"]{ --desk:#2b231e; --desk-fg:#E6D7BF; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--desk-fg);font-family:var(--font-read);font-size:17px;display:flex;align-items:center;justify-content:center;
  padding-block:10px;padding-inline:16px;box-sizing:border-box;overflow:hidden;
  background:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1.5px) 0 0/7px 7px,var(--desk)}
*{box-sizing:border-box}
button,input{font-family:var(--font-read);font-size:17px;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:2.5px dashed var(--pink);outline-offset:3px}

/* ---------- shared sketch surface ---------- */
.tray,.card,.sitem,.btn,.act,.iconbtn,.xbtn,.opt,.toast,#status,.res,.confirm,.chip,.arrow,.heads button,.namebox,#devPanel,.panel,#bubble,.portrait,#devBtn,.cover{
  border:0;background:var(--fr) 0 0/100% 100% no-repeat,var(--hatch) var(--ins),linear-gradient(var(--wash),var(--wash)) var(--ins)}
.btn,.act,.opt,.chip,.toast,.arrow,#devBtn{--fr:var(--fr-btn)}
.tray,.card,.sitem,.panel,.res,.confirm,.namebox,#devPanel,#status,.cover{--fr:var(--fr-card)}
.iconbtn,.xbtn,.portrait,.heads button{--fr:var(--fr-round)}
.tray,.card,.sitem,.btn,.act,.opt,.toast,#status,.res,.confirm,.chip,.namebox,#devPanel,.panel,#bubble,#devBtn,.cover{border-radius:13px 9px 15px 8px}
.iconbtn,.xbtn,.portrait,.heads button,.arrow{border-radius:50%}
.tray{--fr:var(--fr-tray)}
.holdbtn{--fr:var(--fr-wide)}
@keyframes wig{0%{transform:rotate(-1.4deg)}50%{transform:rotate(1.6deg) translateY(-1px)}100%{transform:rotate(-1.4deg)}}
.btn:not([disabled]):hover,.act:hover,.card:hover,.opt:hover,.iconbtn:hover,.xbtn:hover,.arrow:hover,.heads button:hover{animation:wig .45s ease-in-out 2}
.btn:active,.act:active,.opt:active,.card:active{transform:translate(1px,2px) rotate(0)}
/* washi tape */
.taped{position:relative}
.taped::before,.panel::before,.toast::before,#status::before,.sitem::before,.cover::before,.cover::after{content:"";position:absolute;width:78px;height:21px;top:-10px;left:calc(50% - 39px);
  background:var(--tape) center/100% 100% no-repeat;transform:rotate(-4deg);pointer-events:none;z-index:2}
.sitem:nth-child(3n+1)::before{transform:rotate(5deg);filter:hue-rotate(160deg) saturate(1.2)}
.sitem:nth-child(3n+2)::before{left:16px;transform:rotate(-9deg);filter:hue-rotate(250deg)}
.toast::before{width:54px;height:16px;top:-8px;left:12px}
#status::before{width:40px;height:14px;top:-7px;left:-8px;transform:rotate(-30deg)}

/* ---------- stage (sketchbook page) ---------- */
#stage{position:relative;width:min(100%, calc((100dvh - 20px) * 16 / 9));aspect-ratio:16/9;max-height:100%;color:var(--ink);
  background:radial-gradient(var(--dot) 1.1px,transparent 1.6px) 0 0/22px 22px,var(--paper);
  border-radius:6px 10px 8px 12px;box-shadow:0 2px 0 #d9c7ab,0 10px 28px rgba(60,40,25,.28),0 1px 2px rgba(60,40,25,.25);
  display:flex;flex-direction:column;overflow:hidden;overflow:clip;user-select:none;-webkit-user-select:none}
#stage::after{content:"";position:absolute;inset:2px;background:var(--fr-stage) 0 0/100% 100% no-repeat;pointer-events:none;z-index:30;opacity:.7}

/* ---------- HUD ---------- */
#hud{flex:none;display:flex;align-items:center;gap:14px;padding:8px 18px 12px;z-index:5;min-height:62px;
  background:var(--line) left bottom/100% 9px no-repeat,radial-gradient(var(--dot) 1.1px,transparent 1.6px) 0 0/22px 22px,var(--paper)}
#hud .who{display:flex;align-items:center;gap:8px;min-width:0}
.portrait{width:48px;height:48px;flex:none;display:block;--wash:var(--w-cream);padding:5px;transform:rotate(-4deg)}
.portrait svg{width:100%;height:100%;display:block}
#hudName{font-family:var(--font-hand);font-weight:700;font-size:27px;line-height:1.1;padding-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.meters{display:flex;gap:14px;flex:1;min-width:0;justify-content:center}
.meter{display:flex;align-items:center;gap:5px;min-width:0;flex:1;max-width:170px}
.ic{width:28px;height:28px;flex:none;display:inline-block}
.ic svg{width:100%;height:100%;display:block}
.track{position:relative;flex:1;min-width:34px;height:18px}
.track::after{content:"";position:absolute;inset:0;background:var(--fr-tube) 0 0/100% 100% no-repeat;pointer-events:none}
.fill{position:absolute;left:4px;top:4px;bottom:4px;width:50%;max-width:calc(100% - 7px);border-radius:7px 3px 8px 4px;transition:width .4s;
  --m:var(--m-happy);background:repeating-linear-gradient(-62deg,var(--m) 0 2.2px,color-mix(in srgb,var(--m) 55%,#fff) 2.2px 4.4px)}
.meter[data-k="hunger"] .fill{--m:var(--m-hunger)}
.meter[data-k="happy"] .fill{--m:var(--m-happy)}
.meter[data-k="energy"] .fill{--m:var(--m-energy)}
.meter[data-k="clean"] .fill{--m:var(--m-clean)}
.bond .fill{--m:var(--m-bond)}
.num{font-variant-numeric:tabular-nums;font-size:17px;min-width:26px;text-align:right;color:var(--ink)}
.meter.low .track{animation:lowpulse 1s steps(2) infinite}
.meter.low .num{color:#C9475E;font-weight:bold}
@keyframes lowpulse{50%{transform:rotate(-2deg) scale(1.05)}}
.bond{display:flex;align-items:center;gap:6px;min-width:150px}
.bond .lbl{font-family:var(--font-hand);font-size:23px;font-weight:700;white-space:nowrap;line-height:1}
.bond .lbl b{font-family:var(--font-read);font-size:19px}
.bond .track{width:74px;flex:none}
.coins{display:flex;align-items:center;gap:4px;font-size:21px;font-variant-numeric:tabular-nums;min-width:74px}
.coins.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25) rotate(-6deg)}}
.iconbtn{width:48px;height:48px;flex:none;padding:7px;display:grid;place-items:center;--wash:var(--w-cream)}
.iconbtn svg{width:32px;height:32px}

/* ---------- view (scene) ---------- */
#view{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--paper);margin:0 6px}
#view > svg.world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hot{cursor:pointer}
.hot:hover,.hot:focus-visible{filter:drop-shadow(0 0 5px rgba(242,143,165,.95))}
.hot:focus{outline:none}
#status{position:absolute;left:14px;top:12px;z-index:3;padding:4px 14px 5px;font-size:17px;transform:rotate(-1.5deg);pointer-events:none;--wash:var(--paper)}
#devBtn{position:absolute;right:10px;bottom:8px;z-index:3;font-size:15px;padding:3px 12px;min-height:30px;color:var(--muted);--wash:var(--w-lilac);opacity:.8}

#dogPos{transition:transform .9s ease-in-out;transform-box:view-box;transform-origin:0 0}
#dogFx{transform-box:fill-box;transform-origin:50% 85%}
.heartfx{animation:floatUp 1s ease-out forwards;transform-box:fill-box;font-family:var(--font-hand);font-weight:700}
@keyframes floatUp{to{transform:translateY(-90px) rotate(15deg);opacity:0}}
.popfx{animation:floatUp 1.1s ease-out forwards;transform-box:fill-box}
.hop{animation:hop .7s ease-out}
@keyframes hop{45%{transform:translateY(-70px)}}
.tk-roll{animation:tkRoll 1s ease-in-out}
@keyframes tkRoll{50%{transform:translateX(30px) rotate(180deg)}100%{transform:rotate(360deg)}}
.tk-spin{animation:tkSpin 1.2s steps(8)}
@keyframes tkSpin{25%{transform:scaleX(-1)}50%{transform:scaleX(1)}75%{transform:scaleX(-1)}}
.tk-dead{transform:rotate(180deg) translateY(30px);transition:transform .5s}
.tk-dance{animation:tkDance .35s ease-in-out 6 alternate}
@keyframes tkDance{from{transform:rotate(-10deg) translateY(0)}to{transform:rotate(10deg) translateY(-14px)}}
.tk-bow{animation:tkBow 1.4s ease-in-out}
@keyframes tkBow{40%,70%{transform:rotate(14deg) translateY(10px)}}
.tk-paw{animation:tkPaw .3s ease-in-out 5 alternate}
@keyframes tkPaw{to{transform:rotate(-9deg)}}
.tk-lie{animation:tkLie 1.6s ease-in-out}
@keyframes tkLie{30%,75%{transform:scaleY(.62)}}
.tk-zoom{animation:tkZoom 1.8s ease-in-out}
@keyframes tkZoom{25%{transform:translateX(-160px) scaleX(-1)}50%{transform:translateX(140px)}75%{transform:translateX(-80px) scaleX(-1)}}
.tk-tug{animation:tkTug .12s linear 10 alternate}
@keyframes tkTug{from{transform:translateX(-7px) rotate(-2deg)}to{transform:translateX(7px) rotate(2deg)}}
.tk-lean{animation:tkLean 1.6s ease-in-out}
@keyframes tkLean{30%,70%{transform:rotate(-16deg) translateX(-10px)}}
.wobj.got{animation:floatUp .6s ease-out forwards;transform-box:fill-box}
.walkdog{transform-box:fill-box;transform-origin:50% 100%}
.rain{position:absolute;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(105deg,transparent 0 26px,rgba(91,61,50,.28) 26px 27.5px);animation:rain .4s linear infinite;background-size:auto 200%}
.snow{position:absolute;inset:0;pointer-events:none;z-index:2;background-image:radial-gradient(circle,#fff 2px,rgba(91,61,50,.35) 2.6px,transparent 3.2px),radial-gradient(circle,#fff 1.5px,transparent 2.5px);background-size:60px 60px,37px 37px;animation:snow 3s linear infinite}
@keyframes rain{to{background-position:0 48px}}
@keyframes snow{to{background-position:20px 60px,-12px 37px}}

/* speech bubble: PawArt.prop('speech') when present, a pencil frame otherwise */
#bubble{position:absolute;z-index:6;max-width:280px;padding:9px 16px 12px;font-size:18px;line-height:1.2;pointer-events:none;color:var(--ink);--fr:var(--fr-card);transform:rotate(-1.2deg)}
#bubble::after{content:"";position:absolute;left:30px;bottom:-15px;width:22px;height:18px;background:var(--fr-tail) 0 0/100% 100% no-repeat}
html.pa-speech #bubble{background:var(--speech) 0 0/100% 100% no-repeat;padding:10px 18px 30px;--fr:none}
html.pa-speech #bubble::after{display:none}
#bubble.pop{animation:bubblePop .25s ease-out}
@keyframes bubblePop{from{transform:scale(.6) rotate(-6deg)}}

/* ---------- dock (trays under the scene) ---------- */
#dock{flex:none;max-height:44%;min-height:0;display:flex;flex-direction:column;padding:12px 18px 6px;z-index:4;
  background:var(--line) left top/100% 9px no-repeat}
#dock:empty,#dock:has(> .dock-idle:only-child){display:none}
.tray{padding:12px 16px 12px;display:flex;flex-direction:column;gap:6px;min-height:0;max-height:100%;--wash:var(--w-cream)}
.tray-h{display:flex;align-items:center;gap:10px}
.tray-h h3{margin:0;font-family:var(--font-hand);font-weight:700;font-size:28px;flex:1;line-height:1.05}
.tray-body{overflow:auto;min-height:0}
.row{display:flex;gap:12px;flex-wrap:nowrap;overflow-x:auto;padding:6px 4px 8px}
.wrap{display:flex;gap:10px;flex-wrap:wrap}
.dock-idle{display:none}
.xbtn{width:46px;height:46px;font-family:var(--font-hand);font-weight:700;font-size:26px;line-height:1;flex:none;--wash:var(--w-pink)}

/* ---------- action bar: doodled sticker tabs ---------- */
#bar{flex:none;margin-top:auto;display:grid;grid-template-columns:repeat(8,1fr);gap:10px;padding:12px 18px calc(10px + env(safe-area-inset-bottom,0px));z-index:5;min-height:var(--barH);
  background:var(--line) left top/100% 9px no-repeat}
.act{min-height:52px;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;padding:4px 6px;font-family:var(--font-hand);font-weight:700;font-size:23px;line-height:1}
.act .ic{width:30px;height:30px}
.act[data-act="feed"]{--wash:var(--w-peach)} .act[data-act="play"]{--wash:var(--w-yellow)} .act[data-act="walk"]{--wash:var(--w-mint)} .act[data-act="care"]{--wash:var(--w-blue)}
.act[data-act="shop"]{--wash:var(--w-pink)} .act[data-act="wardrobe"]{--wash:var(--w-lilac)} .act[data-act="map"]{--wash:var(--w-mint)} .act[data-act="home"]{--wash:var(--w-cream)}
.act:nth-child(odd){transform:rotate(-1.3deg)}
.act:nth-child(even){transform:rotate(1.1deg)}
.act.on{box-shadow:inset 0 -5px 0 -1px rgba(242,143,165,.55);transform:translateY(-3px) rotate(-1deg)}
.act.on::after{content:"";position:absolute}

/* ---------- buttons, cards ---------- */
.btn{min-height:46px;padding:7px 18px 8px;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;--wash:var(--paper)}
.btn.big{font-family:var(--font-hand);font-weight:700;font-size:28px;padding:8px 26px 10px}
.btn.yes{--wash:var(--w-yellow)} .btn.go{--wash:var(--w-mint)} .btn.no{--wash:var(--paper)} .btn.red{--wash:var(--w-pink)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn .ic{width:24px;height:24px}
.card{flex:none;width:132px;padding:10px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:16px;line-height:1.15;position:relative;touch-action:pan-x;--wash:var(--paper)}
.card:nth-child(3n){transform:rotate(1.2deg)}
.card:nth-child(3n+1){transform:rotate(-1deg)}
.card .art{width:58px;height:58px}
.card .art svg{width:100%;height:100%}
.card b{font-weight:700;font-family:var(--font-hand);font-size:22px;line-height:1}
.card .cnt{position:absolute;right:4px;top:2px;--wash:var(--w-yellow);background:var(--fr-round) 0 0/100% 100% no-repeat,var(--w-yellow);border-radius:50%;min-width:30px;height:30px;display:grid;place-items:center;font-size:16px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 12px 3px;font-size:16px;--wash:var(--paper)}
.chip.lock{--wash:var(--w-peach)}
.chip.own{--wash:var(--w-mint)}
.small{font-size:16px;color:var(--muted)}
.ghost{position:fixed;z-index:50;width:70px;height:70px;pointer-events:none;transform:translate(-50%,-50%) rotate(-8deg)}
.ghost svg{width:100%;height:100%}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:20;background:rgba(91,61,50,.32);display:flex;align-items:center;justify-content:center;padding:22px}
.panel{position:relative;width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;padding:20px 24px 18px;transform:rotate(-.5deg);--wash:var(--paper);
  filter:drop-shadow(0 8px 14px rgba(60,40,25,.25))}
.panel.shop{width:min(900px,100%)}
html.pa-panel .panel.celebrate{background:var(--panelart) 0 0/100% 100% no-repeat;--fr:none}
html.pa-panel .panel.celebrate::before{display:none}
.panel.pop{animation:panelPop .3s ease-out}
@keyframes panelPop{from{transform:scale(.85) rotate(-3deg);opacity:.3}}
.panel h2{margin:0 52px 8px 0;font-family:var(--font-hand);font-weight:700;font-size:40px;line-height:1.05;text-wrap:balance}
.panel h2 .hl{background:linear-gradient(transparent 55%,rgba(242,143,165,.45) 55% 88%,transparent 88%)}
.panel .x{position:absolute;right:14px;top:14px}
.panel-body{overflow:auto;min-height:0;padding:2px}
.panel p{margin:6px 0;line-height:1.35}
.foot{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.confirm{position:absolute;left:16px;right:16px;bottom:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;z-index:3;--wash:var(--w-yellow)}
.confirm p{flex:1 1 220px;margin:0;font-size:18px}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:18px 16px;padding:12px 4px 84px}
.sitem{position:relative;padding:14px 10px 12px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;--wash:var(--paper)}
.sitem .art{width:70px;height:70px}
.sitem .art svg{width:100%;height:100%}
.sitem .art.house{width:130px;height:108px}
.sitem b{font-family:var(--font-hand);font-weight:700;font-size:24px;line-height:1}
.sitem .desc{font-size:16px;line-height:1.2;flex:1}
.price{display:flex;align-items:center;gap:4px;font-size:19px;font-variant-numeric:tabular-nums}
.price .ic{width:24px;height:24px}
.sitem.lockd{--wash:#F3ECE1}
.sitem.lockd .art{filter:grayscale(.85) opacity(.55)}
.tabs{display:flex;gap:10px;margin:2px 0 4px}
.tabs .btn{font-family:var(--font-hand);font-weight:700;font-size:24px;padding:4px 20px 6px}
.tabs .btn[aria-selected="true"]{--wash:var(--w-yellow);transform:translateY(-2px) rotate(-1deg)}
.ward{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
.ward .preview{position:relative;padding:10px;background:var(--fr-card) 0 0/100% 100% no-repeat,var(--hatch) var(--ins),linear-gradient(var(--w-blue),var(--w-blue)) var(--ins)}
.ward .preview svg{width:100%;display:block}
.slot{margin-bottom:10px}
.slot h4{margin:0 0 4px;font-family:var(--font-hand);font-weight:700;font-size:25px}
.opt{min-height:46px;padding:4px 12px;font-size:17px;display:inline-flex;align-items:center;gap:5px;margin:0 8px 8px 0;--wash:var(--paper)}
.opt[aria-pressed="true"]{--wash:var(--w-yellow)}
.opt .ic{width:28px;height:28px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin:10px 0}
.res{padding:8px 10px 10px;text-align:center;--wash:var(--w-cream)}
.res:nth-child(1){--wash:var(--w-yellow)} .res:nth-child(2){--wash:var(--w-pink)} .res:nth-child(3){--wash:var(--w-lilac)} .res:nth-child(4){--wash:var(--w-blue)} .res:nth-child(5){--wash:var(--w-mint)}
.res .v{font-size:30px;font-variant-numeric:tabular-nums;font-family:var(--font-read);line-height:1.1}
.res .k{font-size:16px;color:var(--muted)}
.haul{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.haul span{display:inline-flex;align-items:center;gap:3px;font-size:17px}
.haul svg{width:34px;height:34px}
.unlocks{margin:6px 0;padding-left:0;list-style:none;line-height:1.55;font-size:18px}
.unlocks li::before{content:"\2726  ";color:var(--pink)}
.namebox{width:100%;font-size:34px;font-family:var(--font-hand);font-weight:700;padding:6px 16px;color:var(--ink);--wash:var(--paper)}
.namebox:focus{outline:none;--wash:var(--w-yellow)}
.lu-doodle{display:block;width:100%;height:44px;margin:-4px 0 2px}

/* ---------- toasts: sticky notes ---------- */
#toasts{position:absolute;left:50%;top:76px;transform:translateX(-50%);z-index:15;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;width:min(80%,520px)}
.toast{position:relative;padding:8px 18px 9px;font-size:18px;text-align:center;animation:toastIn .25s ease-out;--wash:var(--paper);filter:drop-shadow(0 3px 4px rgba(60,40,25,.18))}
.toast.good{--wash:var(--w-mint)}.toast.bad{--wash:var(--w-pink)}.toast.gold{--wash:var(--w-yellow)}
@keyframes toastIn{from{transform:translateY(-10px) rotate(-3deg);opacity:0}}

/* ---------- title: sketchbook cover ---------- */
#title{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(var(--dot) 1.1px,transparent 1.6px) 0 0/22px 22px,var(--paper)}
#title .bg{position:absolute;inset:0;opacity:.32;filter:saturate(.8)}
#title .bg svg{width:100%;height:100%}
.cover{position:relative;width:min(64%,860px);height:78%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 40px 30px 76px;--wash:#FFF8EA;transform:rotate(-1deg);filter:drop-shadow(0 10px 18px rgba(60,40,25,.25))}
.cover::before{left:auto;right:-20px;top:20px;transform:rotate(38deg)}
.cover::after{left:-6px;top:auto;bottom:16px;transform:rotate(-34deg);filter:hue-rotate(150deg)}
.cover .rings{position:absolute;left:14px;top:6%;bottom:6%;width:44px}
.cover .rings svg{width:100%;height:100%}
.cover .doodles{position:absolute;inset:0;pointer-events:none}
.cover .doodles svg{width:100%;height:100%}
.logo{position:relative;margin:0;font-family:var(--font-hand);font-weight:700;font-size:clamp(70px,11vmin,132px);line-height:.9;color:var(--ink);letter-spacing:1px;text-align:center}
.logo span{display:inline-block}
.logo::after{content:"";position:absolute;left:4%;right:2%;bottom:6%;height:26%;background:var(--pink);opacity:.4;z-index:-1;border-radius:40% 60% 50% 45%/60% 40% 55% 45%;transform:rotate(-1.5deg)}
.tagline{position:relative;font-family:var(--font-hand);font-size:30px;font-weight:600;color:var(--ink)}
.tbtns{position:relative;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.crayon-note{position:relative;font-family:var(--font-read);font-size:17px;color:var(--muted);transform:rotate(-1.5deg)}
#title .tdog{position:absolute;bottom:2%;right:4%;width:min(24%,280px);z-index:3}
#title .tdog2{position:absolute;bottom:2%;left:2%;width:min(22%,250px);z-index:3}
.adopt-card{display:flex;gap:14px;align-items:center}
.adopt-card .info{flex:1;min-width:0}
.adopt-card h3{margin:0;font-family:var(--font-hand);font-weight:700;font-size:36px;line-height:1}
.adopt-card h3 .small{font-family:var(--font-read);font-size:18px;font-weight:normal}
.adopt-card p{margin:2px 0;font-size:17px;line-height:1.25}
.arrow{width:52px;height:52px;font-size:30px;font-family:var(--font-hand);font-weight:700;flex:none;--wash:var(--w-yellow);--fr:var(--fr-round)}
.heads{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.heads button{width:54px;height:54px;padding:5px;overflow:hidden;--wash:var(--paper)}
.heads button[aria-current="true"]{--wash:var(--w-yellow);transform:scale(1.12) rotate(-5deg)}
.heads svg{width:100%;height:100%;display:block}
.prog{height:20px;position:relative;flex:1}
.prog::after{content:"";position:absolute;inset:0;background:var(--fr-tubew) 0 0/100% 100% no-repeat;pointer-events:none}
.prog i{position:absolute;left:4px;top:4px;bottom:4px;width:0;max-width:calc(100% - 7px);border-radius:7px 3px 8px 4px;background:repeating-linear-gradient(-62deg,#9ccf8f 0 2.2px,#cde8c4 2.2px 4.4px)}
.walkctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.holdbtn{flex:1 1 200px;min-height:58px;font-family:var(--font-hand);font-weight:700;font-size:28px;--wash:var(--w-mint);touch-action:none}
.holdbtn.down{--wash:var(--w-yellow);transform:translate(1px,2px)}
label.tog{display:inline-flex;align-items:center;gap:8px;font-size:17px;min-height:44px}
label.tog input{width:22px;height:22px;accent-color:#e07a92}
#devPanel{position:absolute;right:14px;bottom:calc(var(--barH) + 18px);z-index:25;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:16px;--wash:var(--w-lilac)}
#devPanel b{font-family:var(--font-hand);font-size:24px}
.trickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.trickgrid .btn{flex-direction:column;gap:0;line-height:1.05;font-family:var(--font-hand);font-weight:700;font-size:22px;padding:5px 8px 7px;--wash:var(--w-yellow)}
.trickgrid .btn[aria-disabled="true"]{--wash:var(--paper)}
.trickgrid .btn small{font-family:var(--font-read);font-weight:normal;font-size:15px;color:var(--muted)}

/* phone layout from v1 (not extended, not tested in v2) */
@media (max-aspect-ratio: 4/5){
  #stage{width:100%;height:100%;aspect-ratio:auto;max-height:none}
  #hud{flex-wrap:wrap;row-gap:4px;padding:6px 10px 12px}
  #hudName{display:none}
  .bond{order:2;flex:1;min-width:0} .bond .track{flex:1;width:auto}
  .coins{order:3} #muteBtn{order:4} #gearBtn{order:5}
  .meters{order:6;flex-basis:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .meter .num{display:none}
  #view{flex:none;aspect-ratio:4/3;margin:0}
  #dock{flex:1 1 auto;max-height:none;padding:8px}
  #dock:has(> .dock-idle:only-child){display:flex}
  .dock-idle{display:flex}
  .row{flex-wrap:wrap;overflow:visible}
  .card{width:100px}
  #bar{grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
  .act{flex-direction:column;font-size:18px;gap:0}
  .cover{width:92%;padding:24px 20px 24px 56px}
}

<script id="pawart">/* Paw Haven dog art module, style H "Ugly hand-drawn".
   PawArt.dog(key, {pose, outfit, anim, facing}) -> SVG string (viewBox 0 0 240 200, feet on y=186)
   PawArt.dogHead(key) -> SVG string (viewBox 0 0 100 100)
   PawArt.DOGS -> [{key, name, breed, personality, joke}]
   Each dog is a tiny rig (body, head, ears, legs, tail, face) in local coordinates.
   A pose moves the rig; every part is then drawn with seeded mouse-in-paint jitter,
   three times, and the three redraws flip at 3 fps. No filters. */
window.PawArt = window.PawArt || {};
(function(){
'use strict';
const PA=window.PawArt;
const INK='#2E2320',PEN='#5B3D32',GY=186,W='#FFFFFF';
const mix=(a,b,t)=>{const A=[1,3,5].map(i=>parseInt(a.slice(i,i+2),16)),B=[1,3,5].map(i=>parseInt(b.slice(i,i+2),16));return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
let _n=0;const uid=()=>'pad'+(++_n);
const R1=n=>Math.round(n*10)/10;
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hashS=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const D2R=Math.PI/180;
const rot=(p,a)=>{const c=Math.cos(a*D2R),s=Math.sin(a*D2R);return[p[0]*c-p[1]*s,p[0]*s+p[1]*c]};
const T=(t)=>p=>{const q=rot([p[0]*(t.sx||1),p[1]],t.a||0);return[t.x+q[0],t.y+q[1]]};
const rotAbout=(pts,a,c)=>pts.map(p=>{const q=rot([p[0]-c[0],p[1]-c[1]],a);return[c[0]+q[0],c[1]+q[1]]});
function dense(pts,closed,step){
  const out=[],n=pts.length,m=closed?n:n-1;
  for(let i=0;i<m;i++){const a=pts[i],b=pts[(i+1)%n],k=Math.max(1,Math.round(Math.hypot(b[0]-a[0],b[1]-a[1])/step));
    for(let j=0;j<k;j++)out.push([a[0]+(b[0]-a[0])*j/k,a[1]+(b[1]-a[1])*j/k])}
  if(!closed)out.push(pts[n-1]);
  return out;
}
const circ=(cx,cy,rx,ry,n=14,lop=0)=>{const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push([cx+Math.cos(a)*rx*(1+lop*Math.sin(a*2)),cy+Math.sin(a)*ry*(1+lop*Math.cos(a))*(Math.sin(a)>0?.94:1)])}return p};

const spiral=(cx,cy,r0,r1,turns,n,a0)=>{const p=[];for(let i=0;i<=n;i++){const t=i/n,a=a0+t*turns*Math.PI*2,rr=r1+(r0-r1)*t;p.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr])}return p};

/* ---------- the crude drawing kit: every point it draws is tracked for fitting ---------- */
function kit(r){
  const J=a=>(r()-.5)*2*a,acc=[],bb=[1e9,1e9,-1e9,-1e9],texts=[],LW=3.7;
  const tr=(x,y)=>{if(x<bb[0])bb[0]=x;if(y<bb[1])bb[1]=y;if(x>bb[2])bb[2]=x;if(y>bb[3])bb[3]=y};
  const pl=(P,amp)=>{let d='';for(let i=0;i<P.length;i++){const x=P[i][0]+J(amp),y=P[i][1]+J(amp);tr(x,y);d+=(i?'L':'M')+R1(x)+' '+R1(y)}return d};
  const st=(d,w,c,x='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${x}/>`;
  const h={J,r,acc,bb,texts,LW,tr,
    // bucket fill that misses the outline, plus a jaggy outline that may not close
    shape(pts,fill,o={}){
      if(!pts.length||isNaN(pts[0][0]))return;
      const P=dense(pts,true,o.step||11),n=P.length;let cx=0,cy=0;P.forEach(q=>{cx+=q[0]/n;cy+=q[1]/n});
      const ox=o.ox??2.4+J(1),oy=o.oy??-1.6+J(1),sc=o.sc??.97;
      if(fill)acc.push(`<path d="${pl(P.map(q=>[cx+(q[0]-cx)*sc+ox,cy+(q[1]-cy)*sc+oy]),o.famp??1.1)}Z" fill="${fill}"${o.fop?` fill-opacity="${o.fop}"`:''}/>`);
      if(!o.noline){const s0=Math.floor(r()*n),cnt=n+(o.closed?1:(r()<.55?0:-1)),L=[];for(let i=0;i<=cnt;i++)L.push(P[(s0+i)%n]);acc.push(st(pl(L,o.amp??1.2),o.w||LW,INK))}
    },
    tube(pts,w,fill,o={}){const P=dense(pts,false,8);acc.push(st(pl(P,.9),w+(o.ow??LW*1.45),INK));if(fill)acc.push(st(pl(P,.8),w,fill,` transform="translate(${o.ox??1.2} ${o.oy??-.8})"`))},
    line(pts,w,col,amp=1){acc.push(st(pl(dense(pts,false,7),amp),w,col||INK))},
    dot(x,y,rx,ry,fill){if(isNaN(x))return;x+=J(.5);y+=J(.5);tr(x-rx,y-(ry??rx));tr(x+rx,y+(ry??rx));acc.push(`<ellipse cx="${R1(x)}" cy="${R1(y)}" rx="${R1(rx)}" ry="${R1(ry??rx)}" fill="${fill||INK}"/>`)},
    heart(x,y,s,fill){const p=[];for(let i=0;i<16;i++){const t=i/16*Math.PI*2;p.push([x+s*.062*16*Math.pow(Math.sin(t),3),y-s*.062*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))])}h.shape(p,fill||'#FF4F7B',{w:3.4,step:30,ox:1.5,oy:-1,amp:.8})},
    // waxy crayon streaks inside an ellipse (local rx,ry) mapped by M: a few seeded diagonal strokes, darker + lighter
    crayon(rx,ry,M,col,n){if(isNaN(M([0,0])[0]))return;let d1='',d2='';for(let i=0;i<n;i++){const a=r()*Math.PI*2,rr=Math.sqrt(r())*.74,x=Math.cos(a)*rx*rr,y=Math.sin(a)*ry*rr,l=7+r()*10,p=M([x,y]),q=M([x+l*.55,y-l*.8]);(i%3?d1+=`M${R1(p[0])} ${R1(p[1])}L${R1(q[0])} ${R1(q[1])}`:d2+=`M${R1(p[0])} ${R1(p[1])}L${R1(q[0])} ${R1(q[1])}`)}
      acc.push(`<path d="${d1}" stroke="${mix(col,PEN,col===W?.12:.22)}" stroke-width="2.2" stroke-linecap="round" opacity=".42"/><path d="${d2}" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".32"/>`)},
    text(s,x,y,size,col,rt=0){texts.push({s,x:x+J(1.5),y:y+J(1.2),size,col,rt:rt+J(3)});tr(x-2,y-size);tr(x+size*.7*s.length,y+4)}
  };
  return h;
}

/* ---------- breed rigs (facing right; body-local and head-local coordinates in px) ---------- */
const SP={
 shiba:{name:'Mochi',breed:'Shiba Inu',personality:'Proud, independent, dramatic',joke:'heh.',
  col:'#F7892E',hcol:'#F7892E',light:'#FFE7B3',body:{x:112,y:142,rx:42,ry:22,lop:.05},head:{x:164,y:106,rx:32,ry:28},

  marks:(h,B,Hd,s)=>{h.shape([[-s.body.rx*.55,s.body.ry*.5],[s.body.rx*.3,s.body.ry*.55],[s.body.rx*.95,s.body.ry*.05],[s.body.rx*.75,s.body.ry*.8],[-s.body.rx*.45,s.body.ry*.9]].map(B),s.light,{noline:1});
   const hx=s.head.rx,hy=s.head.ry;h.shape([[-hx*.8,hy*.25],[hx*.05,hy*.12],[hx*.95,hy*.05],[hx*.9,hy*.7],[hx*.2,hy*.95],[-hx*.6,hy*.78]].map(Hd),s.light,{noline:1})}},

  legs:{h:-34,f:30,w:10,col:W},ears:'giant',tail:'nub',eyes:[6.4,5.2],face:{eyes:'open',mouth:'grin',brow:'eager',drool:1,pupil:.74},

  legs:{h:-28,f:25,w:9,sock:W},ears:'tall',tail:'fluffy',eyes:[12,9.5],iris:'#1EA8FF',face:{eyes:'open',mouth:'o',e0:[-.3,-.06],e1:[.36,-.1],nose:[.06,.4],brow:'angry'},
  marks:(h,B,Hd,s)=>{const b=s.body;h.shape([[-b.rx*.7,b.ry*.5],[b.rx*.3,b.ry*.55],[b.rx*.95,b.ry*.1],[b.rx*.8,b.ry*.9],[-b.rx*.5,b.ry*.95]].map(B),W,{noline:1});

/* ---------- pose -> rig layout ---------- */
function layout(s,pose,k){
  const b=s.body,hd=s.head,L={pose,k,face:{...s.face},ears:'norm',tailA:0,tailS:1,blush:0,hearts:0,zz:0,stink:0,mud:0,tear:0};
  L.bT={x:b.x,y:b.y,a:0};L.hT={x:hd.x,y:hd.y,a:0};
  const rel=[hd.x-b.x,hd.y-b.y];
  if(s.face.tilt&&(pose==='idle'||pose==='dirty'||pose==='walk'))L.hT.a=s.face.tilt;
  let legMode='stand',swing=null,kick=-1,lift=0;
  switch(pose){

    if (o.t === 'col') collect(o, i);
    else if (o.t === 'sniff') { o.done = true; W.pauseUntil = now + 1600; W.happy += 3; W.bond += 1; SFX.sniff(); sayW(PICK(SMELLS), W.dogX + 40, 160, 1800); removeObj(i); }
    else if (o.t === 'puddle') { o.done = true; if (hopping) toast('Nice hop! Paws stay (mostly) clean.'); else { W.clean += 5; addStat('clean', -5); SFX.splash(); toast(PICK(MUD), 'bad'); } }
    else if (o.t === 'dig') { if (!W.digWait) { W.digWait = o; W.skipAt = now + 900; $('#digBtn').disabled = false; sayW('Tap the X to dig!', W.dogX + 40, 160, 2000); SFX.boop(440); } }
  });
  if (S.stats.energy <= 0 && !W.ended) { toast(`${NAME()} has run out of legs. Heading home.`, 'bad'); endWalk(false); return; }
  drawWalk(now);
  if (W.dist >= W.len) { endWalk(true); return; }
  W.raf = requestAnimationFrame(walkLoop);
}
function sayW(t, x, y, ms) { say(t, x, y, ms); }
function drawWalk() {
  const s = W.dist;
  const sL = $('#stripL'), oL = $('#objL'), fL = $('#farL'), nL = $('#nearL');
  if (sL) sL.setAttribute('transform', `translate(${-(s % 1200)} 0)`);
  if (fL) fL.setAttribute('transform', `translate(${-((s * 0.35) % 500)} 0)`);
  if (nL) nL.setAttribute('transform', `translate(${-((s * 1.35) % 300)} 0)`);
  if (oL) oL.setAttribute('transform', `translate(${-s} 0)`);
  const bar = $('#walkBar'); if (bar) bar.style.width = (s / W.len * 100) + '%';
  const tm = $('#walkTime'); if (tm) tm.textContent = Math.ceil((W.len - s) / SPEED) + 's left';
  updateHUD();
}
function removeObj(i) { const el = $('#wo' + i); if (el) { el.classList.add('got'); setTimeout(() => el.remove(), 600); } }
function collect(o, i) {
  if (o.done) return; o.done = true; SFX.pop();
  if (o.kind === 'coin') { const v = RINT(1, 5); W.coins += v; } else { W.haul[o.kind] = (W.haul[o.kind] || 0) + 1; }
  W.haul._coins = (W.haul._coins || 0) + (o.kind === 'coin' ? 1 : 0);
  removeObj(i);
}
function tapObj(o) {
  if (!o || o.done || W.ended) return; const i = W.objs.indexOf(o), d = o.x - (W.dist + W.dogX);
  if (o.t === 'col' && d < W.VW) { collect(o, i); return; }
  if (o.t === 'puddle' && d < 320) { hop(); return; }
  if (o.t === 'dig' && (W.digWait === o || Math.abs(d) < 200)) { dig(o); return; }
  if (o.t === 'npc') { SFX.bark(BARK[o.kind]); sayW(PICK(NPC_JOKES), o.x - W.dist, 150, 2200); }
}
function dig(o) {
  if (o.done) return; o.done = true; W.digWait = null; $('#digBtn').disabled = true;
  W.pauseUntil = performance.now() + 1400; W.pose = ''; setWalkPose('eat'); W.pose = 'eat';
  SFX.crunch(); setTimeout(SFX.pop, 500);
  const i = W.objs.indexOf(o); removeObj(i);
  const fav = favAct('digging');
  if (Math.random() < 0.6) { const v = RINT(10, 50); W.coins += v; toast(`Dug up ${v * BOOST.coins} coins and a strong smell!`, 'gold'); }
  else { const k = PICK(W.area === 'beach' ? ['shell', 'shell', 'bone'] : ['acorn', 'bone', 'leaf']); W.haul[k] = (W.haul[k] || 0) + 1; toast(`Treasure! A rare ${k}. ${NAME()} is unbearably proud.`, 'gold'); }
  W.happy += fav ? 6 : 3; W.bond += 2;
}
function meetNpc(o, i) {
  o.met = true; W.npcs++; const el = $('#wo' + i); if (el) el.innerHTML = place(art('dog', o.kind, { pose: 'happy', facing: 'left' }), -102, 172, 204, 170);
  SFX.bark(BARK[o.kind]); W.happy += 5; W.bond += 2; W.pauseUntil = performance.now() + 1500;
  let line = PICK(NPC_JOKES);
  const dressed = SLOTS.some((s) => S.outfit[s]);
  if (dressed) { const c = 3 + (S.outfit.neck === 'Bow Tie' ? 2 : 0); W.coins += c; line = PICK(['Love the outfit. Here, have some coins.', 'Fancy! Is that designer?', 'Wow. Stylish. Take my money.']); setTimeout(() => toast(`Compliment! +${c * BOOST.coins} coins.`, 'gold'), 400); }
  sayW(line, o.x - W.dist - 60, 150, 2600);
}
function endWalk(complete) {
  if (!W || W.ended) return; W.ended = true; cancelAnimationFrame(W.raf);
  const R = W.R, frac = complete ? 1 : W.dist / W.len;
  const base = Math.round(RAND(R.coins[0], R.coins[1]) * frac);
  const coins = addCoins(base + W.coins);
  let happy = Math.round((R.happy * frac + W.happy) * (W.wx === 'sunny' && S.outfit.eyes === 'Heart Sunglasses' ? 1.1 : 1) * (favAct('walks') ? 1.5 : 1));
  addStat('happy', happy);
  let cleanLoss = Math.round(R.clean * frac + (W.wx === 'rainy' && S.outfit.body !== 'Yellow Raincoat' ? 5 * frac : 0));
  addStat('clean', -cleanLoss);
  const bond = frac > 0.05 ? addBond(R.bp * frac + W.bond) : 0;
  const energy = Math.round(W.e0 - S.stats.energy);
  // collection sets
  let setBonus = 0;
  for (const k in W.haul) { if (k === '_coins') continue; const before = S.collection[k] || 0; S.collection[k] = before + W.haul[k]; setBonus += Math.floor(S.collection[k] / 10) - Math.floor(before / 10); }
  const setCoins = setBonus ? addCoins(100 * setBonus) : 0;
  if (frac > 0.05) dailyCare('play');
  markDirty(); hideBubble(); setWalkPose('happy');
  const haul = Object.keys(W.haul).filter((k) => k !== '_coins').map((k) => `<span>${art('collectible', k)} ${k} x${W.haul[k]}</span>`).join('') || '<span class="small">No items. Just vibes.</span>';
  const p = openModal(complete ? `Walk complete: ${esc(R.n)}` : `Walk cut short: ${esc(R.n)}`, `<p>${esc(NAME())} ${complete ? PICK(['had the best time and smells incredible (bad).', 'met friends, sniffed everything, regrets nothing.', 'would like to go again. Now. Please.']) : 'is back early. Still counts. Partly.'}</p>
    <div class="results"><div class="res"><div class="v">+${coins + setCoins}</div><div class="k">Paw Coins</div></div><div class="res"><div class="v">+${happy}</div><div class="k">Happiness</div></div><div class="res"><div class="v">+${bond}</div><div class="k">Bond points</div></div><div class="res"><div class="v">-${energy}</div><div class="k">Energy spent</div></div><div class="res"><div class="v">${cleanLoss + W.clean ? '-' + (cleanLoss + W.clean) : '0'}</div><div class="k">Cleanliness</div></div><div class="res"><div class="v">${W.npcs}</div><div class="k">Dogs met</div></div></div>
    <p style="margin-bottom:2px">Found:</p><div class="haul">${haul}</div>${setBonus ? `<p><b>Collection set complete!</b> +${setCoins} coins.</p>` : ''}`, { cls: 'celebrate', foot: '<button class="btn yes big" id="resOk">Back home</button>', onClose: () => go('yard') });
  $('#resOk', p).onclick = () => { SFX.boop(700); closeModal(); };
  SFX.fanfare();
}

/* ======================= FETCH ======================= */
let F = null;
function enterFetch(toy) {
  setChrome(true, false);
  const fris = toy === 'Frisbee';
  F = { toy, fris, t: 35, score: 0, great: 0, throws: 0, coins: 0, fly: null, ended: false, raf: 0, last: performance.now(), dogX: 430, dogY: 500 };
  view.innerHTML = yardWorldSVG(`<g id="fetchL"><circle id="ringIn" r="24" fill="#FFE3A1" fill-opacity=".35" stroke="#5B3D32" stroke-width="2.5" stroke-dasharray="6 5" opacity="0"/><circle id="ringOut" r="90" fill="none" stroke="#F28FA5" stroke-width="4" opacity="0"/><g id="ballG" opacity="0">${place(art('prop', fris ? 'frisbee' : 'ball'), -30, -30, 60, 60)}</g></g>`);
  $('#bowlG').remove(); dogKey = ''; busy = true; renderDog('idle'); dogTo(0, 0, 1, 0);
  updateHUD(); bindDev();
  dock.innerHTML = `<div class="tray"><div class="tray-h"><h3>Fetch with the ${esc(toy)}</h3><button class="xbtn" id="fQuit" aria-label="Stop fetch">x</button></div>
    <div class="walkctl"><span>Catches: <b id="fScore">0</b></span><span>Time: <b id="fTime">35</b>s</span><div class="prog"><i id="fBar" style="width:100%"></i></div></div>
    <p class="small" style="margin:0">Tap the grass to throw. Tap again (or Space) when the pink ring meets the dashed one.</p></div>`;
  $('#fQuit').onclick = () => endFetch();
  const svg = $('svg.world', view);
  svg.addEventListener('pointerdown', (e) => { SFX.init(); e.preventDefault(); if (F.fly) catchTry(); else { const w = toWorld(svg, e.clientX, e.clientY); throwTo(w.x, w.y); } });
  cur.key = (e) => { const ok = e.key === ' ' || (e.key === 'Enter' && document.activeElement === document.body); if (!ok || e.repeat) return; e.preventDefault(); if (F.fly) catchTry(); else throwTo(RAND(300, 880), RAND(430, 540)); };
  F.raf = requestAnimationFrame(fetchLoop);
  onCleanup(() => { cancelAnimationFrame(F && F.raf); cur.key = null; busy = false; });
  toast('Tap the grass to throw!');
}
function throwTo(x, y) {
  if (F.ended || F.t <= 0) return;
  x = clamp(x, 300, 900); y = clamp(y, 430, 550);
  const T = F.fris ? 1.35 : 1.05;
  F.fly = { x0: 130, y0: 470, x, y, T, t0: performance.now(), tried: false, caught: false };
  F.throws++; addStat('energy', -(F.fris ? 1.5 : 1)); SFX.whoosh();
  const ring = $('#ringIn'), out = $('#ringOut'); ring.setAttribute('cx', x); ring.setAttribute('cy', y - 70); ring.setAttribute('opacity', '1'); out.setAttribute('cx', x); out.setAttribute('cy', y - 70); out.setAttribute('opacity', '1');
  $('#ballG').setAttribute('opacity', '1');
  // dog runs under the landing spot
  const tx = x - 430, ty = y - 500; renderDog('walk', x < F.dogX ? 'left' : 'right'); F.dogX = x; dogTo(tx, ty, 1, T - 0.2);
}
function catchTry() {
  const f = F.fly; if (!f || f.tried) return; f.tried = true;
  const el = (performance.now() - f.t0) / 1000, diff = Math.abs(el - f.T);
  if (diff < 0.2) {
    f.caught = true; const great = diff < 0.08; F.score++; if (great) F.great++;
    const c = (F.fris ? 3 : 2) + (great ? 1 : 0); F.coins += c;
    $('#ballG').setAttribute('opacity', '0'); ringsOff();
    renderDog('jump'); const fx = $('#dogFx'); fx.classList.remove('hop'); void fx.getBBox(); fx.classList.add('hop');
    great ? SFX.fanfare() : SFX.pop(); setTimeout(() => SFX.bark(BARK[S.dog.key]), 200);
    fxText(great ? 'GREAT CATCH!' : 'Caught it!', f.x, f.y - 190, great ? '#F2C744' : '#9CCF8F', 44);
    $('#fScore').textContent = F.score;
    setTimeout(() => { if (!F.ended) renderDog('happy'); }, 700);
    F.fly = null;
  } else { fxText('Too early!', f.x, f.y - 190, '#F28FA5', 38); SFX.boop(300); }
}
function ringsOff() { $('#ringIn').setAttribute('opacity', '0'); $('#ringOut').setAttribute('opacity', '0'); }
function fetchLoop(now) {
  if (!F || F.ended) return;
  const dt = Math.min(0.05, (now - F.last) / 1000); F.last = now;
  F.t = Math.max(0, F.t - dt);
  $('#fTime').textContent = Math.ceil(F.t); $('#fBar').style.width = (F.t / 35 * 100) + '%';
  const f = F.fly;
  if (f) {
    const el = (now - f.t0) / 1000, p = Math.min(1, el / f.T);
    const bx = f.x0 + (f.x - f.x0) * p, by = f.y0 + (f.y - 70 - f.y0) * p - (F.fris ? 160 : 230) * 4 * p * (1 - p);
    $('#ballG').setAttribute('transform', `translate(${bx} ${by}) rotate(${p * 540})`);
    $('#ringOut').setAttribute('r', 24 + 90 * Math.max(0, 1 - el / f.T));
    if (el > f.T + 0.22) {
      F.fly = null; ringsOff(); SFX.thud(); setTimeout(SFX.trombone, 150);
      $('#ballG').setAttribute('transform', `translate(${f.x} ${f.y - 20})`);
      fxText(PICK(['Missed!', 'Bonk.', 'Nope.']), f.x, f.y - 160, '#F28FA5', 38);
      renderDog('sad'); setTimeout(() => { if (!F.ended) { renderDog('idle'); $('#ballG').setAttribute('opacity', '0'); } }, 900);
    }
  }
  updateHUD();
  if (F.t <= 0 && !F.fly) { endFetch(); return; }
  F.raf = requestAnimationFrame(fetchLoop);
}
function endFetch() {
  if (!F || F.ended) return; F.ended = true; cancelAnimationFrame(F.raf);
  const golden = S.dog.key === 'golden' ? 1.25 : 1;
  const coins = F.coins ? addCoins(F.coins * golden) : 0;
  const key = 'toyAt_' + F.toy, full = !S[key] || S.gameMin - S[key] >= 10; S[key] = S.gameMin;
  const happy = Math.round((F.fris ? 20 : 15) * Math.min(1, F.score / 6 + 0.2) * (favAct('fetch') ? 1.5 : 1) * (S.dog.favToy === F.toy ? 1.5 : 1) * (full ? 1 : 0.25));
  addStat('happy', happy);
  const bond = F.throws ? addBond((5 + F.score) * (full ? 1 : 0.25)) : 0;
  if (F.throws) dailyCare('play');
  markDirty();
  const p = openModal('Fetch results', `<p>${F.score >= 6 ? `${esc(NAME())} is a fetch legend. Statues are being considered.` : F.score >= 3 ? `Solid fetching. ${esc(NAME())} would rate you 7/10.` : `${esc(NAME())} has questions about your throwing arm.`}</p>
    <div class="results"><div class="res"><div class="v">${F.score}</div><div class="k">Catches (${F.great} great)</div></div><div class="res"><div class="v">+${coins}</div><div class="k">Paw Coins${golden > 1 ? ' (Golden +25%)' : ''}</div></div><div class="res"><div class="v">+${happy}</div><div class="k">Happiness</div></div><div class="res"><div class="v">+${bond}</div><div class="k">Bond points</div></div></div>${full ? '' : '<p class="small">Fetch again so soon is less exciting. Wait 10 game minutes for full rewards.</p>'}`, { cls: 'celebrate', foot: '<button class="btn yes big" id="fOk">Back home</button>', onClose: () => go('yard') });
  $('#fOk', p).onclick = () => { SFX.boop(700); closeModal(); };
}

/* ======================= SETTINGS + DEV ======================= */
function openSettings() {
  const motionOff = document.documentElement.dataset.motion === 'off';
  const p = openModal('Settings', `
    <label class="tog"><input type="checkbox" id="setSound" ${SFX.isMuted() ? '' : 'checked'}> Sound effects (silly, synthesized)</label><br>
    <label class="tog"><input type="checkbox" id="setMotion" ${motionOff ? '' : 'checked'}> Motion and wobble</label>
    <p class="small">Time: 1 game hour = 1 real minute. Prototype economy: coins x${BOOST.coins}, Bond x${BOOST.bond}, naps x${BOOST.nap}.</p>
    <p class="small">Keys: 1-8 bottom buttons, Space pets / throws / walks, Esc closes things.</p>
    <div class="foot" style="justify-content:space-between"><button class="btn red" id="setReset">Reset save</button><button class="btn" id="setTitle">Title screen</button></div>`);
  $('#setSound', p).onchange = (e) => { SFX.setMuted(!e.target.checked); prefs.mute = !e.target.checked; savePrefs(); updateMute(); };
  $('#setMotion', p).onchange = (e) => setMotion(e.target.checked);
  $('#setTitle', p).onclick = () => { saveNow(); closeModal(); go('title'); };
  $('#setReset', p).onclick = async () => {
    const ok = await confirmIn(p, `Delete ${esc(NAME())}'s save forever? Coins, clothes, houses, Bond: all gone.`, 'Yes, reset', 'No way'); if (!ok) return;
    lsDel(SAVE_KEY); S = null; levelQueue = []; closeModal(); toast('Save deleted. Fresh crayons.'); go('title');
  };
}
function setMotion(on) { document.documentElement.dataset.motion = on ? 'on' : 'off'; prefs.motion = on ? 'on' : 'off'; savePrefs(); }
function bindDev() { const b = $('#devBtn'); if (b) b.onclick = () => { devPanel.hidden = !devPanel.hidden; renderDev(); }; }
function renderDev() {
  devPanel.innerHTML = `<b>Dev panel</b><button class="btn" id="dvCoins">+500 coins</button><button class="btn" id="dvBond">+1 Bond level</button><button class="btn" id="dvFill">Fill all meters</button><button class="btn" id="dvDrain">Drain all meters</button><button class="btn" id="dvDay">Skip to next day</button><button class="btn no" id="dvX">Close</button>`;
  $('#dvCoins').onclick = () => { addCoins(500, { raw: true }); toast('+500 coins. Money printer goes brrr.', 'gold'); };
  $('#dvBond').onclick = () => { if (S.bond.level >= 10) { toast('Already max Bond.'); return; } addBond(BOND_TH[S.bond.level] - S.bond.pts, { raw: true }); };
  $('#dvFill').onclick = () => { for (const k in S.stats) S.stats[k] = 100; updateHUD(); markDirty(); };
  $('#dvDrain').onclick = () => { for (const k in S.stats) S.stats[k] = 15; updateHUD(); markDirty(); };
  $('#dvDay').onclick = () => { S.gameMin = (Math.floor(S.gameMin / 1440) + 1) * 1440 + 480; dailyCheck(); updateHUD(); toast('Good morning. Daily bonuses reset.'); };
  $('#dvX').onclick = () => { devPanel.hidden = true; };
}

/* ======================= TIME LOOP ======================= */
function applyAway() {
  if (!S) return; const secs = clamp((Date.now() - (S.lastReal || Date.now())) / 1000, 0, 7 * 86400); const hrs = secs / 60;
  if (secs < 5) return;
  S.gameMin += secs; const s = S.stats;
  const fl = (v, rate, floor) => (v > floor ? Math.max(floor, v - rate * hrs) : v);
  s.hunger = fl(s.hunger, 3, 30); s.happy = fl(s.happy, 2, 40); s.clean = fl(s.clean, 1, 40); s.energy = clamp(s.energy + 20 * hrs, 0, 100);
  S.lastReal = Date.now(); dailyCheck(); markDirty();
  if (secs > 120) setTimeout(() => toast(`While you were away, ${NAME()} napped for ${Math.round(hrs)} game hours and missed you a normal amount.`, 'gold'), 800);
}
let lastTick = performance.now(), saveClock = 0;
function tick() {
  const now = performance.now(), dt = Math.min(5, (now - lastTick) / 1000); lastTick = now;
  if (!S || !['yard', 'market', 'map', 'shelter', 'walk', 'fetch', 'bath'].includes(cur.mode)) return;
  S.gameMin += dt; const h = dt / 60;
  const wasDay = S.daily.day; if (dailyCheck() && wasDay) toast(`Day ${day()}: ${WEATHER_TXT[weather()]}. Daily bonuses reset.`, 'gold');
  addStat('hunger', -6 * h * (S.dog.key === 'corgi' ? 1.2 : 1));
  addStat('happy', -houseInfo().hd * h);
  addStat('clean', -3 * h);
  if (S.sleeping) {
    addStat('energy', napRate() * h); const nb = $('#napBar'); if (nb) nb.style.width = S.stats.energy + '%';
    if (S.stats.energy >= 100) wake(true);
  } else if (cur.mode !== 'walk') addStat('energy', -2 * h);
  if (cur.mode === 'yard' && !busy && $('#dogArt')) renderDog(dogPoseNow());
  updateHUD();
  saveClock += dt; if (saveClock > 3 && dirty) { saveClock = 0; saveNow(); }
}

/* ======================= INPUT ======================= */
window.addEventListener('pointerdown', () => SFX.init(), { capture: true });
window.addEventListener('keydown', (e) => {
  SFX.init();
  if (cur.key && modal.hidden) { cur.key(e); if (e.defaultPrevented) return; }
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (e.key === 'Escape') { if (!modal.hidden) { closeModal(); return; } if (!devPanel.hidden) { devPanel.hidden = true; return; } if (['market', 'map', 'shelter'].includes(cur.mode)) go('yard'); else if (cur.mode === 'yard') closeTray(); return; }
  if (!modal.hidden || tag === 'INPUT') return;
  if (!bar.hidden && /^[1-8]$/.test(e.key)) { doAct(ACTS[+e.key - 1][0]); return; }
  if (cur.mode === 'yard' && e.key === ' ' && tag !== 'BUTTON') { e.preventDefault(); petTick(560 + RAND(-30, 30), 380); }
});
window.addEventListener('keyup', (e) => { if (cur.keyup) cur.keyup(e); });
$('#muteBtn').onclick = () => { SFX.init(); SFX.setMuted(!SFX.isMuted()); prefs.mute = SFX.isMuted(); savePrefs(); updateMute(); if (!SFX.isMuted()) SFX.boop(700); };
$('#gearBtn').onclick = () => { SFX.click(); openSettings(); };
window.addEventListener('pagehide', saveNow);
let wasPortrait = null;
window.addEventListener('resize', () => { const p = portrait(); if (wasPortrait !== null && p !== wasPortrait && ['map', 'market'].includes(cur.mode) && modal.hidden) go(cur.mode); wasPortrait = p; });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });

/* ======================= BOOT ======================= */
function start(data) {
  data = data || {};
  if (prefs.motion) document.documentElement.dataset.motion = prefs.motion;
  else if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.dataset.motion = 'off';
  SFX.setMuted(!!prefs.mute);
  buildHUD(); buildBar();
  const snap = data.S && data.S.dog ? data.S : null;
  S = snap || loadSave();
  if (snap && ['yard', 'market', 'map', 'shelter'].includes(data.mode)) { applyAway(); go(data.mode); }
  else if (snap) { applyAway(); go('yard'); }
  else go('title');
  setInterval(tick, 250);
  try { window.claude?.hot?.snapshot?.(() => ({ S: S ? JSON.parse(JSON.stringify(S)) : null, mode: cur.mode })); } catch (e) { /* no hot reload host */ }
  window.__paw = { get S() { return S; }, get mode() { return cur.mode; }, go, feed, saveNow, get W() { return W; }, get F() { return F; } };
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body></html>
