# Worker "pawhaven-api": the cloud save and login (v2.8.1). Contract: docs/CLOUDFLARE_LOGIN.md.
#   Deploy:  bash tools/cf_api_deploy.sh   (or, with a token: npx wrangler deploy -c cloudflare/wrangler.toml)
#   Schema:  cloudflare/schema.sql (run against D1 "pawhaven")
name = "pawhaven-api"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "pawhaven"
database_id = "d6bacd44-9f88-4c66-9ef6-ca15417a5c97"

# v2.32 "A letter from your dog" (V232_letters.md 3): Sundays 10:00 JST (01:00 UTC) and hourly for the 48 hours after it (the backlog).
# The Worker checks the window itself. tools/cf_api_deploy.sh sets the same two schedules.
[triggers]
crons = ["0 1-23 * * SUN", "0 * * * MON"]
