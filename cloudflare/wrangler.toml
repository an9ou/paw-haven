# Worker "pawhaven-api": the cloud save and login (v2.8.1). Contract: docs/CLOUDFLARE_LOGIN.md.
#   Deploy:  bash tools/cf_api_deploy.sh   (or, with a token: npx wrangler deploy -c cloudflare/wrangler.toml)
#   Schema:  cloudflare/schema.sql (run against D1 "pawhaven")
name = "pawhaven-api"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "pawhaven"
database_id = "d6bacd44-9f88-4c66-9ef6-ca15417a5c97"
