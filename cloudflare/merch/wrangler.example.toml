# doodle-doggo-merch: an EXAMPLE only (TRANSACTIONS.md 6.4, PART3.md). Nothing here is deployed; no ids, no secrets.
# Before any deploy the owner approves it and sets every secret in the dashboard (names below). Copy to wrangler.toml only then.
name = "doodle-doggo-merch"
main = "worker.js"
compatibility_date = "2026-03-24"          # or later: the Browser Run binding needs it (part 4)
workers_dev = false
# routes = [{ pattern = "merch-api.doodledoggo.app", custom_domain = true }]   # the owner adds the custom domain [O]

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "MerchLedger"                 # one instance, 'ledger': every table, the alarm, all order logic

[[durable_objects.bindings]]
name = "PRINTS"
class_name = "MerchPrints"                 # one per JST day, 'p-YYYY-MM-DD' (-b, -c ...): the PNGs only

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MerchLedger", "MerchPrints"]   # SQLite Durable Objects: nothing to create beforehand, Free plan

[triggers]
crons = ["*/10 * * * *"]                   # the backstop wake + the nightly job after 04:00 JST (count the account's 5 cron triggers first)

[assets]
directory = "./assets"                     # assets/merch/print/<ART_VER>/ (node cloudflare/merch/build_assets.mjs); every released folder stays
binding = "ASSETS"
run_worker_first = true

# [browser]
# binding = "BROWSER"                      # part 4 (Browser Run); part 3 talks only through RENDER_FETCH, which is never set in production

[vars]
MERCH_FROM = ""                            # empty = the shop is shut (the safe default). Launch time, ISO with the JST offset, only with the owner's date
MERCH_OFF = ""                             # "1": no new checkouts; paid orders finish
MERCH_COUNTRIES = ""                       # empty = none. Recommended at launch (section 10.1): catalog.js LAUNCH_COUNTRIES ("all,-GB,-IM,<EU 27>,-MC,-GF,-GP,-MQ,-RE,-YT,-MF,-BR,-KR")
MERCH_PRODUCTS = "mug,tee"
MERCH_DAY_CAP = "10"
MERCH_PROVIDER_MODE = "draft"              # "draft" never confirms (no wholesale charge); "live" only with the owner's go-ahead
MERCH_COOL_MIN = "60"
MERCH_STRIPE_VERSION = "2025-03-31.basil"
MERCH_ART_VERS = ""                        # older print folders still served (build_assets.mjs prints it)
MAIL_FROM = "orders@doodledoggo.app"
MERCH_SITE = "https://doodledoggo.app"                # a plain https origin only; anything else falls back to https://doodledoggo.app (util.js siteOf)
MERCH_PUBLIC_URL = "https://merch-api.doodledoggo.app"
MERCH_OWNER_TO = ""                        # the owner's address for owner emails: set in the dashboard, not here
MERCH_SELLER_NAME = ""                     # part 6: the seller's legal name for the email footer; empty = the line is left out (never invented)
MERCH_SELLER_ADDR = ""                     # part 6: the seller's business address for the same line; set by the owner with the name
MERCH_GIFT_NAME = ""                       # part 6: the thank-you gift's item name; empty = "a little gift for your dog in the game"

# Secrets (wrangler secret put, by the owner; never in the repo or chat):
#   MERCH_STRIPE_KEY              restricted: Checkout Sessions write, Refunds write, Charges / PaymentIntents / Disputes read
#   MERCH_STRIPE_WEBHOOK_SECRET   the merch account's webhook endpoint (events: TRANSACTIONS.md 6.3)
#   MERCH_PROVIDER_KEY            Printful (part 5)
#   MERCH_PROVIDER_WEBHOOK_SECRET Printful's signing secret, if Printful signs (part 5)
#   MERCH_FILE_KEY                signs the print file links (random, 32+ bytes)
#   MERCH_HASH_KEY                HMAC for email and IP hashes (random, 32+ bytes; never rotate without a plan: flags use it)
#   MERCH_ADMIN_KEY               tools/merch.sh (random, 32+ bytes)
#   RESEND_API_KEY                send-only, this Worker
# Never set in production: STRIPE_FETCH, PROVIDER_FETCH, RENDER_FETCH, MAIL_FETCH, NOW, PAWPRINT (test seams). Without them part 3 refuses every order.

# [env.test]: wrangler does NOT inherit vars, Durable Object bindings or the browser binding into an environment (S12), so every one is repeated
# here. Top-level keys that are inherited (main, compatibility_date, migrations, triggers, assets): checked again at the first test deploy (part 9).
[env.test]                                 # doodle-doggo-merch-test: sandbox keys, Printful draft, only https://test.doodledoggo.app
name = "doodle-doggo-merch-test"
# routes = [{ pattern = "merch-api-test.doodledoggo.app", custom_domain = true }]   # [O]

[[env.test.durable_objects.bindings]]
name = "LEDGER"
class_name = "MerchLedger"                 # the test Worker's own objects: never the live ones

[[env.test.durable_objects.bindings]]
name = "PRINTS"
class_name = "MerchPrints"

# [env.test.browser]
# binding = "BROWSER"                      # part 4

[env.test.vars]
MERCH_TEST = "1"                           # refuses sk_live / rk_live keys and every origin but the test copy
MERCH_FROM = ""
MERCH_OFF = ""
MERCH_COUNTRIES = ""
MERCH_PRODUCTS = "mug,tee"
MERCH_DAY_CAP = "10"
MERCH_PROVIDER_MODE = "draft"              # the test Worker never confirms at Printful
MERCH_COOL_MIN = "60"
MERCH_STRIPE_VERSION = "2025-03-31.basil"
MERCH_ART_VERS = ""
MAIL_FROM = "orders@doodledoggo.app"
MERCH_SITE = "https://test.doodledoggo.app" # order links in emails point at the test copy, never the live site
MERCH_PUBLIC_URL = "https://merch-api-test.doodledoggo.app"
MERCH_OWNER_TO = ""
MERCH_SELLER_NAME = ""
MERCH_SELLER_ADDR = ""
MERCH_GIFT_NAME = ""
# The test Worker's secrets are its own (sandbox keys), set with `wrangler secret put --env test`: the same names as above.
