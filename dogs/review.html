<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&display=swap" rel="stylesheet">
<style>body{margin:0;padding:8px;background:#ddd;font:12px monospace}.g{display:grid;grid-template-columns:repeat(5,260px);gap:6px}.c{background:#fff;position:relative}.c svg{display:block;width:260px;height:auto;outline:1px dashed #bbb}.c b{position:absolute;left:4px;top:2px}</style></head><body><div class="g" id="g"></div>
<script src="pawart_dogs.js"></script><script>
const q=new URLSearchParams(location.search),k=q.get('k')||'shiba',mode=q.get('m')||'poses',fr=+(q.get('f')||0);
const POSES=['idle','happy','pet','eat','sleep','walk','jump','sit','sad','dirty','crouch','shake','cold','hot','dig','beg','squat','leglift','paw','down','rollover','playdead','speak','dance','bow','scratch','sniff','yawn','howl'];
const OUTS=[{head:'Party Hat'},{head:'Flower Crown'},{eyes:'Heart Sunglasses'},{neck:'Red Bandana'},{neck:'Bow Tie'},{body:'Yellow Raincoat'},{body:'Knit Winter Sweater'},{body:'Superhero Cape'},{head:'Party Hat',eyes:'Heart Sunglasses',neck:'Red Bandana',body:'Superhero Cape'},{head:'Flower Crown',neck:'Bow Tie',body:'Knit Winter Sweater'}];
const TRE=[{head:'Acorn Cap'},{eyes:'Explorer Goggles'},{neck:'Seashell Necklace'},{neck:'Clover Collar'},{body:'Mossy Poncho'},{head:'Acorn Cap',eyes:'Explorer Goggles',neck:'Clover Collar',body:'Mossy Poncho'},{head:'Acorn Cap',neck:'Seashell Necklace',body:'Mossy Poncho'}];
const NEWO=[{head:'Rain Hat'},{head:'Pom-pom Beanie'},{body:'Frog Raincoat'},{body:'Polka-dot Raincoat'},{body:'Bubble Raincoat'}];
let items=mode==='all1'?POSES.slice(0,10).map(p=>[p,{pose:p}]):mode==='all2'?POSES.slice(10,20).map(p=>[p,{pose:p}]):mode==='all3'?POSES.slice(20).map(p=>[p,{pose:p}]).concat([['head',{head:1}]]):mode==='idle3'?['sniff','yawn','howl'].map(p=>[p,{pose:p}]).concat(['sniff','yawn','howl'].map((p,i)=>[p+' outfit',{pose:p,outfit:OUTS[8+i%2]}])).concat([['sniff merle left',{pose:'sniff',facing:'left',coat:{base:'#2B2430',light:'#FFE7B3',dark:'#1D1A22',white:.6,merle:true,eyes:'odd'},seed:'a'}],['yawn raincoat',{pose:'yawn',outfit:{head:'Rain Hat',body:'Frog Raincoat'}}],['howl beanie',{pose:'howl',outfit:{head:'Pom-pom Beanie',body:'Bubble Raincoat',eyes:'Explorer Goggles'}}],['idle',{pose:'idle'}]]):mode==='tricks'?['paw','down','rollover','playdead','speak','dance','bow','scratch','sit','idle'].map(p=>[p,{pose:p}]):mode==='tricks2'?['paw','down','rollover','playdead','speak','dance','bow','scratch'].map((p,i)=>[p+' outfit',{pose:p,outfit:OUTS[8+i%2]}]).concat([['rollover cape',{pose:'rollover',outfit:{body:'Superhero Cape',head:'Rain Hat'}}],['dance raincoat',{pose:'dance',outfit:{body:'Frog Raincoat',head:'Pom-pom Beanie'}}]]):mode==='potty'?[['squat',{pose:'squat'}],['leglift',{pose:'leglift'}],['squat combo',{pose:'squat',outfit:OUTS[8]}],['leglift combo',{pose:'leglift',outfit:OUTS[8]}],['squat combo2',{pose:'squat',outfit:OUTS[9]}],['leglift combo2',{pose:'leglift',outfit:OUTS[9]}],['squat raincoat',{pose:'squat',outfit:{body:'Frog Raincoat',head:'Rain Hat'}}],['leglift poncho',{pose:'leglift',outfit:{body:'Mossy Poncho',head:'Acorn Cap',eyes:'Explorer Goggles'}}],['squat left',{pose:'squat',facing:'left'}],['leglift left',{pose:'leglift',facing:'left'}]]:mode==='beg'?[['beg',{pose:'beg'}],['beg f',{pose:'beg'}]].concat(OUTS.slice(0,8).map(o=>['beg '+Object.values(o).join('+'),{pose:'beg',outfit:o}])):mode==='new'?['crouch','shake','cold','hot','dig'].map(p=>[p,{pose:p}]).concat(NEWO.map(o=>[Object.values(o)[0],{outfit:o}])):mode==='newpose'?['crouch','shake','cold','hot','dig'].map((p,i)=>[p+' +rain',{pose:p,outfit:{head:i%2?'Pom-pom Beanie':'Rain Hat',body:['Frog Raincoat','Polka-dot Raincoat','Bubble Raincoat'][i%3]}}]).concat([['idle',{pose:'idle'}],['crouch f1',{pose:'crouch'}]]):mode==='treasure'?TRE.map(o=>[Object.values(o).join('+'),{outfit:o}]).concat(['sleep','jump','sit'].map((p,i)=>[p+' treasure',{pose:p,outfit:TRE[5+i%2]}])):mode==='poses'?POSES.map(p=>[p,{pose:p}]):mode==='outfits'?OUTS.map(o=>[Object.values(o).join('+'),{outfit:o}]):POSES.map((p,i)=>[p+' combo',{pose:p,outfit:OUTS[8+i%2]}]);
document.getElementById('g').innerHTML=items.map(([t,o])=>`<div class="c">${o.head?PawArt.dogHead(k):PawArt.dog(k,{...o,anim:true})}<b>${t}</b></div>`).join('');
const st=document.createElement('style');st.textContent=`.pa-dog [class^=pa-d-f]{animation:none!important;opacity:0!important}.pa-dog .pa-d-f${fr}{opacity:1!important}`;document.head.appendChild(st);
</script></body></html>
