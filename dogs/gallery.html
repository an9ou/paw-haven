<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paw Haven dog art gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF8EC;color:#2a2420;font:16px/1.4 'Patrick Hand',system-ui,sans-serif;padding:16px}
h1,h2,h3{font-family:'Gloria Hallelujah',cursive;font-weight:400;margin:18px 0 8px}
h1{font-size:30px}h2{font-size:24px;border-top:3px dashed #e3cfae;padding-top:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:17px;padding:6px 14px;border:3px solid #2a2420;border-radius:14px 10px 16px 9px;background:#FFD60A;cursor:pointer}
.grid{display:grid;gap:8px}
.g10{grid-template-columns:repeat(9,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.cell{background:#fff;border:2px solid #e8d6b8;border-radius:12px;padding:4px;min-width:0}
.cell svg{display:block;width:100%;height:auto}
.cell code{display:block;font:11px/1.25 ui-monospace,Menlo,monospace;color:#7a6250;word-break:break-word;margin-top:2px}
.row{margin-bottom:6px}
.sizes{display:flex;gap:16px;align-items:end;flex-wrap:wrap}
.sizes .cell{display:inline-block}
.dark{background:#2a1e18;padding:10px;border-radius:12px}
@media (max-width:900px){.g10{grid-template-columns:repeat(5,minmax(0,1fr))}.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head>
<body>
<h1>Paw Haven: dog art module (style H)</h1>
<div class="bar"><button id="mot" type="button">Pause motion</button><button id="still" type="button">Toggle .pa-still on page</button><span id="perf"></span></div>
<div id="out"></div>
<script src="pawart_dogs.js"></script>
<script src="../mods/genes.js"></script>

 const step=()=>{const t=performance.now();while(i<jobs.length&&performance.now()-t<40){const [k,o,g]=jobs[i++];try{tmp.innerHTML=P.dog(k,o);if(o.mix)P.dogHead(k,o)}catch(e){errs.push(k+'/'+JSON.stringify(o)+': '+e.message);continue}cnt[g]=cnt[g]||[0,0];tmp.querySelectorAll('[class^="pa-d-f"]').forEach(fr=>{cnt[g][0]++;const n=fr.querySelectorAll('.pa-d-leg').length;if(n!==4){cnt[g][1]++;bad.push(`${g} ${k}/${o.mix?o.mix.head+'-head/':''}${o.pose}:${n}`)}})}
  if(i<jobs.length){el.textContent=`v2 leg check: ${i}/${jobs.length} dogs...`;setTimeout(step,0);return}
  el.textContent=`v2 leg check: ${jobs.length} dogs, `+Object.keys(cnt).map(g=>`${g} ${cnt[g][0]} frames (${cnt[g][1]} bad)`).join(', ')+'; '+(bad.length||errs.length?'FAIL '+bad.concat(errs).slice(0,10).join(', '):'all have exactly 4 legs, no errors');el.style.background=bad.length||errs.length?'#ffd0d0':'#d8f5d0';el.dataset.done='1'};
 setTimeout(step,50)}
const t0=performance.now();for(let i=0;i<100;i++)P.dog(K[i%6],{pose:POSES[i%10],outfit:i%3?null:COMBOS[i%2]});
document.getElementById('perf').textContent=`100 dog() calls: ${((performance.now()-t0)/100).toFixed(2)} ms each`;
