<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Art A Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Patrick+Hand&family=Gloria+Hallelujah&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3EBDD;--ink:#5B3D32;--line:#E3D2BA;--card:#FFFBF3}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 'Patrick Hand',system-ui,sans-serif;padding:20px}
h1,h2{font-family:'Caveat',cursive;font-weight:700;margin:22px 0 8px}h1{font-size:40px}h2{font-size:30px}
code{font:13px ui-monospace,Menlo,monospace;background:#fff;padding:2px 6px;border-radius:6px}
.scene{width:1280px;height:720px;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.scene svg,.cell svg{display:block;width:100%;height:100%}
.grid{display:grid;grid-template-columns:70px repeat(4,300px);gap:6px;align-items:center;width:max-content}
.grid .hd{font:18px 'Caveat',cursive;font-weight:700;text-align:center}
.cell{width:300px;height:180px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.strip{display:flex;width:1200px;height:200px;border:2px solid var(--line);border-radius:10px;overflow:hidden;position:relative;margin-bottom:6px}
.strip svg{display:block;width:600px;height:200px;flex:none}
.strip::after{content:"seam";position:absolute;left:600px;top:0;bottom:0;border-left:2px dashed rgba(242,143,165,.8);color:#F28FA5;font:14px 'Patrick Hand';padding-left:4px}
.lab{font-size:15px;margin:4px 0 2px}
#perf{background:#fff;border-radius:10px;padding:8px 12px;display:inline-block;max-width:1240px}
section{margin-bottom:10px}
.showhot .pa-wa-hl{opacity:1!important}
.bigmap{width:1280px;height:800px;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}.bigmap svg{width:100%;height:100%;display:block}.bigcrop{width:1280px;height:720px;overflow:hidden;border:2px solid var(--line);border-radius:10px;margin-top:8px}.bigcrop>div{transform:translate(-700px,-380px)}.bigcrop svg{width:2400px;height:1500px;display:block}
.hotrow{display:flex;gap:8px;flex-wrap:wrap;width:1250px}.hotrow .cell{width:410px;height:246px}
</style></head><body>
<h1>Paw Haven world art, module A: time of day and weather</h1>
<p id="perf"></p>
<div id="out"></div>
<script src="../pawart_world_a.js"></script>
<script>
const P=window.PawArt,T=['dawn','day','dusk','night'],W=['sunny','cloudy','rain','snow'];let h='';const times=[];
const t=f=>{const a=performance.now();const s=f();times.push(performance.now()-a);return s};
const d0=performance.now();P.scene('yard');const dYard=performance.now()-d0;
const grid=(name,fn)=>{let g=`<section class="sec-${name}"><h2>${name}: 4 times × 4 weathers <code>${fn('X','Y',1)}</code></h2><div class="grid"><div></div>${W.map(w=>`<div class="hd">${w}</div>`).join('')}`;
  T.forEach(tm=>{g+=`<div class="hd">${tm}</div>`;W.forEach(w=>{g+=`<div class="cell">${fn(tm,w)}</div>`})});return g+'</div></section>'};
const zG=s=>s.replace('</svg>','<g fill="none" stroke="#E0457B" stroke-width="3" stroke-dasharray="10 6">'+[[220,250],[420,250],[620,250],[220,390],[420,390],[620,390]].map(([x,y])=>`<rect x="${x}" y="${y}" width="160" height="110"/>`).join('')+'<rect x="40" y="380" width="160" height="160"/><rect x="820" y="240" width="160" height="340"/></g></svg>');
const zK=s=>s.replace('</svg>','<g fill="none" stroke="#E0457B" stroke-width="3" stroke-dasharray="10 6"><rect x="430" y="280" width="160" height="140"/><rect x="400" y="240" width="120" height="120"/><rect x="220" y="340" width="180" height="80"/><path d="M30 170h160M30 260h160M30 350h160"/><rect x="640" y="80" width="180" height="160"/><rect x="640" y="380" width="220" height="160"/><rect x="870" y="96" width="120" height="334"/></g></svg>');
h+=grid('garden',(tm,w,sig)=>sig?`PawArt.scene('garden', {time, weather})  (day+sunny cell: plot, dog and decor zones dashed)`:(tm==='day'&&w==='sunny'?zG:x=>x)(t(()=>P.scene('garden',{time:tm,weather:w}))));
h+=grid('kitchen',(tm,w,sig)=>sig?`PawArt.scene('kitchen', {time, weather})  (day+sunny cell: stove, pot spot, board, shelves, window, dog spot, fridge dashed)`:(tm==='day'&&w==='sunny'?zK:x=>x)(t(()=>P.scene('kitchen',{time:tm,weather:w}))));
h+=`<section class="sec-hot"><h2>v1.3 hotspots (hover outlines forced on): yard patch empty / growing / ready, house kitchen, market sprout cart</h2><div class="hotrow showhot">`;
[["yard",{patch:'empty'}],["yard",{}],["yard",{patch:'ready'}],["house",{}],["market",{}],["market",{time:'night',weather:'snow'}]].forEach(([n,o])=>{h+=`<div><div class="lab"><code>scene('${n}', ${JSON.stringify(o)})</code></div><div class="cell">${P.scene(n,o)}</div></div>`});
h+='</div></section><section class="sec-v13close"><h2>v1.3 at full size</h2>';
[['garden',{}],['garden',{time:'night',weather:'snow'}],['kitchen',{}],['kitchen',{time:'night',weather:'rain'}],['market',{}],['yard',{patch:'empty'}]].forEach(([n,o])=>{h+=`<h2>scene('${n}', ${JSON.stringify(o)})</h2><div class="scene showhot">${P.scene(n,o)}</div>`});
h+='</section>';
h+='<section class="sec-v131"><h2>v1.3.1: house without the built-in bed, map with plain captions</h2>';
[['house',{bed:false}],['house',{}],['map',{locked:['woods','beach']}],['map',{}]].forEach(([n,o])=>{h+=`<h2>scene('${n}', ${JSON.stringify(o)})</h2><div class="scene">${P.scene(n,o)}</div>`});h+='</section>';
const HUBS=['house','park','river','woods','beach'],COMBOS=[['day','sunny'],['night','rain'],['dusk','cloudy'],['day','snow']];
const zones=s=>s.replace('</svg>','<g fill="none" stroke="#E0457B" stroke-width="3" stroke-dasharray="10 6"><rect x="300" y="430" width="260" height="90"/><circle cx="250" cy="520" r="26"/><rect x="620" y="330" width="240" height="190"/></g></svg>');
h+=`<section class="sec-hubs"><h2>New hangout hubs <code>PawArt.scene(name, {time, weather})</code> (top row: overlay zones dashed)</h2><div class="grid"><div></div>${COMBOS.map(c=>`<div class="hd">${c.join(' + ')}</div>`).join('')}`;
HUBS.forEach(n=>{h+=`<div class="hd">${n}</div>`;COMBOS.forEach(([tm,w],i)=>{const s=t(()=>P.scene(n,{time:tm,weather:w}));h+=`<div class="cell">${i===0?zones(s):s}</div>`})});
h+='</div></section><section class="sec-hubclose"><h2>Hubs at full size</h2>';
HUBS.forEach(n=>COMBOS.forEach(([tm,w])=>{h+=`<h2>scene('${n}', {time:'${tm}', weather:'${w}'})</h2><div class="scene">${P.scene(n,{time:tm,weather:w})}</div>`}));
h+='</section><section class="sec-cleanstrips"><h2>woods and beach strips, walking line cleared (day + sunny, tiled twice)</h2>';
['woods','beach'].forEach(a=>{h+=`<div class="strip">${P.walkStrip(a)}${P.walkStrip(a)}</div>`});h+='</section>';
h+=grid('yard',(tm,w,sig)=>sig?`PawArt.scene('yard', {time, weather})`:t(()=>P.scene('yard',{time:tm,weather:w})));
h+=grid('market',(tm,w,sig)=>sig?`PawArt.scene('market', {time, weather})`:t(()=>P.scene('market',{time:tm,weather:w})));
h+=grid('shelter',(tm,w,sig)=>sig?`PawArt.scene('shelter', {time, weather})`:t(()=>P.scene('shelter',{time:tm,weather:w})));
h+=`<section class="sec-bigmap"><h2>v1.6 town map <code>PawArt.scene('map', {locked:['woods','beach','dogpark','salon','hilltop','pier','river']})</code>, viewBox 2400×1500 (MAP_AREAS centres marked)</h2><div class="bigmap">${P.scene('map',{locked:['woods','beach','dogpark','salon','hilltop','pier','river']}).replace('</svg>',P.MAP_AREAS.map(a=>`<circle cx="${a.x}" cy="${a.y}" r="8" fill="#E0457B"/>`).join('')+'</svg>')}</div><div class="bigcrop"><div style="width:2400px;height:1500px">${P.scene('map',{locked:['woods','beach']})}</div></div></section>`;
h+=`<section class="sec-strips"><h2>walkStrip(area, {time, weather}): night and snow, tiled twice</h2>`;
['park','river','woods','beach'].forEach(a=>[['night','sunny'],['day','snow'],['night','rain'],['dusk','sunny']].forEach(([tm,w])=>{const s=t(()=>P.walkStrip(a,{time:tm,weather:w}));
  h+=`<div class="lab"><code>PawArt.walkStrip('${a}', {time:'${tm}', weather:'${w}'})</code></div><div class="strip">${s}${P.walkStrip(a,{time:tm,weather:w})}</div>`}));
h+=`</section><section class="sec-close"><h2>Close-ups at full size</h2>`;
[['yard','night','sunny'],['yard','day','snow'],['yard','dusk','rain'],['market','night','rain'],['market','dawn','sunny'],['shelter','night','snow'],['map','night','sunny'],['market','day','sunny']].forEach(([n,tm,w])=>{
  h+=`<h2>scene('${n}', {time:'${tm}', weather:'${w}'})</h2><div class="scene">${P.scene(n,{time:tm,weather:w,locked:n==='map'?['woods','beach']:undefined})}</div>`});
h+='</section>';
document.getElementById('out').innerHTML=h;
times.sort((a,b)=>a-b);
document.getElementById('perf').textContent=`${times.length} fresh variant renders: median ${times[times.length>>1].toFixed(1)} ms, p90 ${times[Math.floor(times.length*.9)].toFixed(1)} ms, worst ${times[times.length-1].toFixed(1)} ms (first ever call, cold: default yard ${dYard.toFixed(1)} ms). Cached repeat calls only swap ids.`;
document.querySelectorAll('[data-shop],[data-area],[data-hot]').forEach(g=>g.addEventListener('click',()=>{document.getElementById('perf').textContent='clicked '+(g.dataset.shop||g.dataset.area||g.dataset.hot)+(g.dataset.locked?' (locked)':'')}));
</script></body></html>
