<!doctype html><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#FFFBF3;display:flex;flex-wrap:wrap;gap:6px;padding:6px}svg{width:var(--s);height:var(--s);background:#fff;border:1px solid #eee}</style>
<script src="../pawart_world_b.js"></script>
<script>
const q=new URLSearchParams(location.search),f=q.get('f'),s=q.get('s')||'160px';document.documentElement.style.setProperty('--s',s);
const L=PawArt.WORLD_B[{icon:'icons',item:'items',house:'houses',collectible:'collectibles',prop:'props'}[f]];
const from=+(q.get('a')||0),to=+(q.get('b')||99);
document.write(L.slice(from,to).map(n=>PawArt[f](n)).join(''));
</script>
