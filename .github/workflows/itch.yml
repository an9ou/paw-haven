name: Upload to itch.io

# Builds the itch.io copy (node tools/itch.js: no dev button, brand icons) and uploads it with butler
# to the HTML5 channel of https://<ITCH_USER>.itch.io/<ITCH_GAME>.
# Runs when a version tag is pushed (git tag v2.9 && git push origin v2.9) or by hand from the Actions tab.
# Needs, in GitHub repo Settings > Secrets and variables > Actions:
#   secret   BUTLER_API_KEY  an itch.io API key (itch.io > Settings > API keys)
#   variable ITCH_USER       the itch.io username
#   variable ITCH_GAME       the project's URL name on itch.io (default: doodle-doggo)
# The project page must already exist on itch.io (Kind of project: HTML); butler only uploads builds.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itch
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_USER: ${{ vars.ITCH_USER }}
      ITCH_GAME: ${{ vars.ITCH_GAME || 'doodle-doggo' }}
    steps:
      - name: Check the itch.io settings
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_USER" ]; then
            echo "::error::Add the BUTLER_API_KEY secret and the ITCH_USER variable (repo Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the itch.io copy
        run: node tools/itch.js
      - name: Install butler
        run: |
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler -V
      - name: Upload to itch.io
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          ./butler/butler push dist/itch "$ITCH_USER/$ITCH_GAME:html5" --userversion "$VERSION"
