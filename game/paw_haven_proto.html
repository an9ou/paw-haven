<title>Paw Haven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Gloria+Hallelujah&family=Patrick+Hand&display=swap">
<style>
/* Layout: a 16:9 sketchbook page lying on a kraft desk (laptop first). Pencil frames are
   stretchable SVG data URIs generated at boot (--fr-*); colour is a coloured-pencil wash with
   light hatching, drifting a few px off the line. The crude crayon dogs are the joke. */
:root{
  --desk:#E6D7BF;          /* page chrome around the sketchbook */
  --desk-fg:#5B3D32;
  --paper:#FFFBF3;         /* sketchbook paper (fixed in both themes) */
  --dot:#E3D2BA;
  --ink:#5B3D32;           /* warm brown pencil */
  --graph:#A8968A;         /* graphite construction lines */
  --pink:#F28FA5;
  --w-yellow:#FFE3A1; --w-mint:#C8E9CF; --w-blue:#CBE0F4; --w-pink:#F9D0D9; --w-peach:#FCD8BC; --w-lilac:#E0D5F0; --w-cream:#FFF4DF;
  --m-hunger:#F4A262; --m-happy:#F2C744; --m-energy:#86B3EA; --m-clean:#86CFD6; --m-bond:#F28FA5;
  --muted:#8A7468;
  --font-hand:'Caveat','Patrick Hand','Comic Sans MS',cursive;
  --font-read:'Patrick Hand','Trebuchet MS',sans-serif;
  --font-scrawl:var(--font-hand);
  --hatch:repeating-linear-gradient(-58deg,rgba(255,255,255,.34) 0 1.6px,transparent 1.6px 5px);
  --ins:4px 3px/calc(100% - 7px) calc(100% - 7px) no-repeat;
  --wash:var(--paper);
  --fr:none;
  --barH:74px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --desk:#2b231e; --desk-fg:#E6D7BF; color-scheme:dark } }
:root[data-theme="dark"]{ --desk:#2b231e; --desk-fg:#E6D7BF; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--desk-fg);font-family:var(--font-read);font-size:17px;display:flex;align-items:center;justify-content:center;
  padding-block:10px;padding-inline:16px;box-sizing:border-box;overflow:hidden;
  background:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1.5px) 0 0/7px 7px,var(--desk)}
*{box-sizing:border-box}
button,input{font-family:var(--font-read);font-size:17px;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:2.5px dashed var(--pink);outline-offset:3px}

/* ---------- shared sketch surface ---------- */
.tray,.card,.sitem,.btn,.act,.iconbtn,.xbtn,.opt,.toast,#status,.res,.confirm,.chip,.arrow,.heads button,.namebox,#devPanel,.panel,#bubble,.portrait,#devBtn,.cover{
  border:0;background:var(--fr) 0 0/100% 100% no-repeat,var(--hatch) var(--ins),linear-gradient(var(--wash),var(--wash)) var(--ins)}
.btn,.act,.opt,.chip,.toast,.arrow,#devBtn{--fr:var(--fr-btn)}
.tray,.card,.sitem,.panel,.res,.confirm,.namebox,#devPanel,#status,.cover{--fr:var(--fr-card)}
.iconbtn,.xbtn,.portrait,.heads button{--fr:var(--fr-round)}
.tray,.card,.sitem,.btn,.act,.opt,.toast,#status,.res,.confirm,.chip,.namebox,#devPanel,.panel,#bubble,#devBtn,.cover{border-radius:13px 9px 15px 8px}
.iconbtn,.xbtn,.portrait,.heads button,.arrow{border-radius:50%}
.tray{--fr:var(--fr-tray)}
.holdbtn{--fr:var(--fr-wide)}
@keyframes wig{0%{transform:rotate(-1.4deg)}50%{transform:rotate(1.6deg) translateY(-1px)}100%{transform:rotate(-1.4deg)}}
.btn:not([disabled]):hover,.act:hover,.card:hover,.opt:hover,.iconbtn:hover,.xbtn:hover,.arrow:hover,.heads button:hover{animation:wig .45s ease-in-out 2}
.btn:active,.act:active,.opt:active,.card:active{transform:translate(1px,2px) rotate(0)}
/* washi tape */
.taped{position:relative}
.taped::before,.panel::before,.toast::before,#status::before,.sitem::before,.cover::before,.cover::after{content:"";position:absolute;width:78px;height:21px;top:-10px;left:calc(50% - 39px);
  background:var(--tape) center/100% 100% no-repeat;transform:rotate(-4deg);pointer-events:none;z-index:2}
.sitem:nth-child(3n+1)::before{transform:rotate(5deg);filter:hue-rotate(160deg) saturate(1.2)}
.sitem:nth-child(3n+2)::before{left:16px;transform:rotate(-9deg);filter:hue-rotate(250deg)}
.toast::before{width:54px;height:16px;top:-8px;left:12px}
#status::before{width:40px;height:14px;top:-7px;left:-8px;transform:rotate(-30deg)}

/* ---------- stage (sketchbook page) ---------- */
#stage{position:relative;width:min(100%, calc((100dvh - 20px) * 16 / 9));aspect-ratio:16/9;max-height:100%;color:var(--ink);
  background:radial-gradient(var(--dot) 1.1px,transparent 1.6px) 0 0/22px 22px,var(--paper);
  border-radius:6px 10px 8px 12px;box-shadow:0 2px 0 #d9c7ab,0 10px 28px rgba(60,40,25,.28),0 1px 2px rgba(60,40,25,.25);
  display:flex;flex-direction:column;overflow:hidden;overflow:clip;user-select:none;-webkit-user-select:none}
#stage::after{content:"";position:absolute;inset:2px;background:var(--fr-stage) 0 0/100% 100% no-repeat;pointer-events:none;z-index:30;opacity:.7}

/* ---------- HUD ---------- */
#hud{flex:none;display:flex;align-items:center;gap:14px;padding:8px 18px 12px;z-index:5;min-height:62px;
  background:var(--line) left bottom/100% 9px no-repeat,radial-gradient(var(--dot) 1.1px,transparent 1.6px) 0 0/22px 22px,var(--paper)}
#hud .who{display:flex;align-items:center;gap:8px;min-width:0}
.portrait{width:48px;height:48px;flex:none;display:block;--wash:var(--w-cream);padding:5px;transform:rotate(-4deg)}
.portrait svg{width:100%;height:100%;display:block}
#hudName{font-family:var(--font-hand);font-weight:700;font-size:27px;line-height:1.1;padding-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.meters{display:flex;gap:14px;flex:1;min-width:0;justify-content:center}
.meter{display:flex;align-items:center;gap:5px;min-width:0;flex:1;max-width:170px}
.ic{width:28px;height:28px;flex:none;display:inline-block}
.ic svg{width:100%;height:100%;display:block}
.track{position:relative;flex:1;min-width:34px;height:18px}
.track::after{content:"";position:absolute;inset:0;background:var(--fr-tube) 0 0/100% 100% no-repeat;pointer-events:none}
.fill{position:absolute;left:4px;top:4px;bottom:4px;width:50%;max-width:calc(100% - 7px);border-radius:7px 3px 8px 4px;transition:width .4s;
  --m:var(--m-happy);background:repeating-linear-gradient(-62deg,var(--m) 0 2.2px,color-mix(in srgb,var(--m) 55%,#fff) 2.2px 4.4px)}
.meter[data-k="hunger"] .fill{--m:var(--m-hunger)}
.meter[data-k="happy"] .fill{--m:var(--m-happy)}
.meter[data-k="energy"] .fill{--m:var(--m-energy)}
.meter[data-k="clean"] .fill{--m:var(--m-clean)}
.bond .fill{--m:var(--m-bond)}
.num{font-variant-numeric:tabular-nums;font-size:17px;min-width:26px;text-align:right;color:var(--ink)}
.meter.low .track{animation:lowpulse 1s steps(2) infinite}
.meter.low .num{color:#C9475E;font-weight:bold}
@keyframes lowpulse{50%{transform:rotate(-2deg) scale(1.05)}}
.bond{display:flex;align-items:center;gap:6px;min-width:150px}
.bond .lbl{font-family:var(--font-hand);font-size:23px;font-weight:700;white-space:nowrap;line-height:1}
.bond .lbl b{font-family:var(--font-read);font-size:19px}
.bond .track{width:74px;flex:none}
.coins{display:flex;align-items:center;gap:4px;font-size:21px;font-variant-numeric:tabular-nums;min-width:74px}
.coins.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25) rotate(-6deg)}}
.iconbtn{width:48px;height:48px;flex:none;padding:7px;display:grid;place-items:center;--wash:var(--w-cream)}
.iconbtn svg{width:32px;height:32px}

/* ---------- view (scene) ---------- */
#view{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--paper);margin:0 6px}
#view > svg.world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hot{cursor:pointer}
.hot:hover,.hot:focus-visible{filter:drop-shadow(0 0 5px rgba(242,143,165,.95))}
.hot:focus{outline:none}
#status{position:absolute;left:14px;top:12px;z-index:3;padding:4px 14px 5px;font-size:17px;transform:rotate(-1.5deg);pointer-events:none;--wash:var(--paper)}
#devBtn{position:absolute;right:10px;bottom:8px;z-index:3;font-size:15px;padding:3px 12px;min-height:30px;color:var(--muted);--wash:var(--w-lilac);opacity:.8}

#dogPos{transition:transform .9s ease-in-out;transform-box:view-box;transform-origin:0 0}
#dogFx{transform-box:fill-box;transform-origin:50% 85%}
.heartfx{animation:floatUp 1s ease-out forwards;transform-box:fill-box;font-family:var(--font-hand);font-weight:700}
@keyframes floatUp{to{transform:translateY(-90px) rotate(15deg);opacity:0}}
.popfx{animation:floatUp 1.1s ease-out forwards;transform-box:fill-box}
.hop{animation:hop .7s ease-out}
@keyframes hop{45%{transform:translateY(-70px)}}
.tk-roll{animation:tkRoll 1s ease-in-out}
@keyframes tkRoll{50%{transform:translateX(30px) rotate(180deg)}100%{transform:rotate(360deg)}}
.tk-spin{animation:tkSpin 1.2s steps(8)}
@keyframes tkSpin{25%{transform:scaleX(-1)}50%{transform:scaleX(1)}75%{transform:scaleX(-1)}}
.tk-dead{transform:rotate(180deg) translateY(30px);transition:transform .5s}
.tk-dance{animation:tkDance .35s ease-in-out 6 alternate}
@keyframes tkDance{from{transform:rotate(-10deg) translateY(0)}to{transform:rotate(10deg) translateY(-14px)}}
.tk-bow{animation:tkBow 1.4s ease-in-out}
@keyframes tkBow{40%,70%{transform:rotate(14deg) translateY(10px)}}
.tk-paw{animation:tkPaw .3s ease-in-out 5 alternate}
@keyframes tkPaw{to{transform:rotate(-9deg)}}
.tk-lie{animation:tkLie 1.6s ease-in-out}
@keyframes tkLie{30%,75%{transform:scaleY(.62)}}
.tk-zoom{animation:tkZoom 1.8s ease-in-out}
.tk-tornado{animation:tkSpin .3s steps(4) 6}
.tk-lap{animation:tkLap 2.2s ease-in-out}
@keyframes tkLap{20%{transform:translateX(260px)}40%{transform:translateX(260px) scaleX(-1)}70%{transform:translateX(-220px) scaleX(-1)}85%{transform:translateX(-220px)}}
@keyframes tkZoom{25%{transform:translateX(-160px) scaleX(-1)}50%{transform:translateX(140px)}75%{transform:translateX(-80px) scaleX(-1)}}
.tk-tug{animation:tkTug .12s linear 10 alternate}
@keyframes tkTug{from{transform:translateX(-7px) rotate(-2deg)}to{transform:translateX(7px) rotate(2deg)}}
.tk-lean{animation:tkLean 1.6s ease-in-out}
.tk-shake{animation:tkShake .09s linear 14 alternate}
@keyframes tkShake{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.tk-shiver{animation:tkShiver .12s linear infinite alternate}
@keyframes tkShiver{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}
@keyframes tkLean{30%,70%{transform:rotate(-16deg) translateX(-10px)}}
.wobj.got{animation:floatUp .6s ease-out forwards;transform-box:fill-box}
.walkdog{transform-box:fill-box;transform-origin:50% 100%}
.wxfx{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.wxfx::before,.wxfx::after{content:"";position:absolute;inset:-60px 0 0 0}
.wxfx.rain::before{background:repeating-linear-gradient(104deg,transparent 0 23px,rgba(70,92,128,.42) 23px 24.4px,transparent 24.4px 61px);background-size:auto 120px;animation:wxRain .55s linear infinite}
.wxfx.rain::after{background:repeating-linear-gradient(101deg,transparent 0 37px,rgba(91,61,50,.22) 37px 38.2px,transparent 38.2px 89px);background-size:auto 170px;animation:wxRain2 .8s linear infinite}
@keyframes wxRain{to{background-position:-26px 120px}}
@keyframes wxRain2{to{background-position:-27px 170px}}
.wxfx.snow::before{background-image:radial-gradient(circle,#fff 2.2px,rgba(91,61,50,.5) 2.8px,transparent 3.4px);background-size:70px 70px;animation:wxSnow 5s linear infinite}
.wxfx.snow::after{background-image:radial-gradient(circle,#fff 1.5px,rgba(91,61,50,.35) 2px,transparent 2.6px);background-size:43px 43px;background-position:20px 10px;animation:wxSnow2 3.4s linear infinite}
@keyframes wxSnow{to{background-position:24px 70px}}
@keyframes wxSnow2{to{background-position:6px 53px}}
.tintfx{position:absolute;inset:0;pointer-events:none;z-index:1;mix-blend-mode:multiply}
.tintfx.night{background:linear-gradient(#2b3566,#46507a 60%,#5b6386);opacity:.62}
.tintfx.dusk{background:linear-gradient(#e7a3b8,#f3c49a);opacity:.45}
.tintfx.dawn{background:linear-gradient(#f9c6b6,#fde3c4);opacity:.35}
.tintfx.day.w-rain,.tintfx.day.w-cloudy{background:#b9c2cf;opacity:.45}
.tintfx.day.w-snow{background:#dfe6ee;opacity:.35}
.sex{font-family:var(--font-read);font-weight:700;font-size:.85em;margin-left:2px}
.sex.m{color:#5B8FD6}.sex.f{color:#E07AA0}
.sexpick{margin:6px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:16px}
.sexbtn{min-height:40px;padding:3px 14px 5px;font-size:18px}
.sexbtn.m[aria-pressed="true"]{--wash:#CBE0F4}.sexbtn.f[aria-pressed="true"]{--wash:#F9D0D9}
#hudClock{font-size:16px;color:var(--muted);white-space:nowrap}
#stage.modhud #hudClock{display:inline!important}
.buffchip{display:flex;align-items:center;gap:4px;padding:2px 10px 3px 4px;font-size:16px;border-radius:12px 6px 12px 7px;background:var(--fr-btn) 0 0/100% 100% no-repeat,var(--w-mint)}
.buffchip .ic{width:26px;height:26px}
.pip-top{display:flex;gap:12px;align-items:center}.pip-art{width:80px;height:100px;flex:none}.pip-art svg{width:100%;height:100%}
.sitem.people{cursor:pointer;position:relative}.pawstop{position:absolute;right:8px;top:8px;width:30px;height:30px}.pawstop svg{width:100%;height:100%}
.stars{color:#C08A12;letter-spacing:1px}
.profile .pf-head{display:flex;gap:16px;align-items:center}.portrait.big{width:110px;height:110px}
.profile h3{margin:0;font-family:var(--font-hand);font-size:38px}.profile p{margin:2px 0}
.pf-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:12px}
.pf-tree{width:120px;height:56px}.season.on{color:#C9475E;font-weight:bold}
.genes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.gslot{display:inline-flex;flex-direction:column;align-items:center;border:1.5px dashed #A8968A;border-radius:6px;padding:2px 6px;font-size:14px}.gslot i{font-style:normal;color:var(--graph);font-size:18px}
.teaser{--wash:var(--w-yellow)}
.pin{display:inline-block;width:16px;height:20px;vertical-align:-4px;margin-right:3px}
.pin svg{width:100%;height:100%}
.pname{font-family:var(--font-hand);font-size:20px;font-weight:700}
#placeBtns{position:absolute;right:12px;bottom:46px;z-index:3;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
#placeBtns .btn{min-height:40px;padding:4px 14px 6px;font-size:17px}
.onway{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(91,61,50,.18)}
.onway-card{position:relative;width:420px;padding:18px 20px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border-radius:13px 9px 15px 8px;
  background:var(--fr-card) 0 0/100% 100% no-repeat,var(--hatch) var(--ins),linear-gradient(var(--w-cream),var(--w-cream)) var(--ins);filter:drop-shadow(0 6px 10px rgba(60,40,25,.25))}
.onway-card b{font-family:var(--font-hand);font-size:32px}
.onway-dog{width:150px;height:125px;animation:trot 1.2s linear}
.onway-dog svg{width:100%;height:100%}
@keyframes trot{from{transform:translateX(-120px)}to{transform:translateX(120px)}}
#stage.slimhud .meters,#stage.slimhud .bond,#stage.slimhud #muteBtn,#stage.slimhud #gearBtn{display:none}
#stage.slimhud #hud{justify-content:space-between;min-height:52px}
.routes{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:14px 0 16px;background:radial-gradient(var(--dot) 1.1px,transparent 1.6px) 0 0/22px 22px,var(--paper);overflow:hidden}
.rt-title{margin:0 0 6px;font-family:var(--font-hand);font-size:40px;line-height:1}
.rt-viewport{position:relative;width:100%;flex:1;min-height:0;overflow:hidden;touch-action:pan-y;cursor:grab}
.rt-track{position:absolute;top:8px;left:0;display:flex;gap:36px;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.rt-card{width:580px;flex:none;padding:14px 16px 12px;border-radius:13px 9px 15px 8px;opacity:.55;transform:scale(.86) rotate(-1deg);transition:transform .45s,opacity .45s;--wash:var(--paper);
  background:var(--fr-card) 0 0/100% 100% no-repeat,var(--hatch) var(--ins),linear-gradient(var(--wash),var(--wash)) var(--ins)}
.rt-card.cur{opacity:1;transform:scale(1) rotate(0)}
.rt-card.locked{--wash:#F3ECE1}
.rt-card.locked .rt-prev svg{filter:grayscale(.85) opacity(.6)}
.rt-prev{position:relative;height:262px;border-radius:10px;overflow:hidden;border:2px solid #5B3D32}
.rt-prev svg{width:100%;height:100%;display:block}
.rt-lock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);font-size:24px;background:rgba(255,251,243,.9)}
.rt-card h3{margin:8px 0 2px;font-family:var(--font-hand);font-weight:700;font-size:34px;line-height:1}
.rt-meta{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.rt-paws{display:flex;gap:2px}
.rt-paw{width:26px;height:26px;opacity:.25}
.rt-paw.on{opacity:1}
.rt-card p{margin:4px 0}
.rt-env{font-size:17px}
.rt-nav{display:flex;align-items:center;gap:16px;margin:6px 0}
.rt-foot{display:flex;gap:16px;align-items:center}
.wxic{display:inline-block;width:22px;height:22px;vertical-align:-5px;margin-right:5px}
.wxic svg{width:100%;height:100%}
.vol{display:grid;grid-template-columns:28px 120px 1fr 44px;gap:10px;align-items:center;margin:6px 0}
.vol .ic{width:26px;height:26px}
.vol input[type=range]{width:100%;accent-color:#e07a92}
.vol output{font-variant-numeric:tabular-nums;text-align:right}
.devsel{display:flex;gap:6px;align-items:center;font-size:15px}
.devsel select{font-family:var(--font-read);font-size:15px;padding:2px 4px}
.rain{position:absolute;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(105deg,transparent 0 26px,rgba(91,61,50,.28) 26px 27.5px);animation:rain .4s linear infinite;background-size:auto 200%}
.snow{position:absolute;inset:0;pointer-events:none;z-index:2;background-image:radial-gradient(circle,#fff 2px,rgba(91,61,50,.35) 2.6px,transparent 3.2px),radial-gradient(circle,#fff 1.5px,transparent 2.5px);background-size:60px 60px,37px 37px;animation:snow 3s linear infinite}
@keyframes rain{to{background-position:0 48px}}
@keyframes snow{to{background-position:20px 60px,-12px 37px}}

/* speech bubble: PawArt.prop('speech') when present, a pencil frame otherwise */
#bubble{position:absolute;z-index:6;max-width:280px;padding:9px 16px 12px;font-size:18px;line-height:1.2;pointer-events:none;color:var(--ink);--fr:var(--fr-card);transform:rotate(-1.2deg)}
#bubble::after{content:"";position:absolute;left:30px;bottom:-15px;width:22px;height:18px;background:var(--fr-tail) 0 0/100% 100% no-repeat}
html.pa-speech #bubble{background:var(--speech) 0 0/100% 100% no-repeat;padding:10px 18px 30px;--fr:none}
html.pa-speech #bubble::after{display:none}
#bubble.pop{animation:bubblePop .25s ease-out}
@keyframes bubblePop{from{transform:scale(.6) rotate(-6deg)}}

/* ---------- dock (trays under the scene) ---------- */
#dock{flex:none;max-height:44%;min-height:0;display:flex;flex-direction:column;padding:12px 18px 6px;z-index:4;
  background:var(--line) left top/100% 9px no-repeat}
#dock:empty,#dock:has(> .dock-idle:only-child){display:none}
.tray{padding:12px 16px 12px;display:flex;flex-direction:column;gap:6px;min-height:0;max-height:100%;--wash:var(--w-cream)}
.tray-h{display:flex;align-items:center;gap:10px}
.tray-h h3{margin:0;font-family:var(--font-hand);font-weight:700;font-size:28px;flex:1;line-height:1.05}
.tray-body{overflow:auto;min-height:0}
.row{display:flex;gap:12px;flex-wrap:nowrap;overflow-x:auto;padding:6px 4px 8px}
.wrap{display:flex;gap:10px;flex-wrap:wrap}
.dock-idle{display:none}
.xbtn{width:46px;height:46px;font-family:var(--font-hand);font-weight:700;font-size:26px;line-height:1;flex:none;--wash:var(--w-pink)}

/* ---------- action bar: doodled sticker tabs ---------- */
#bar{flex:none;margin-top:auto;display:grid;grid-template-columns:repeat(7,1fr);gap:12px;padding:12px 18px calc(10px + env(safe-area-inset-bottom,0px));z-index:5;min-height:var(--barH);
  background:var(--line) left top/100% 9px no-repeat}
.act{min-height:52px;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:5px;padding:4px 4px;font-family:var(--font-hand);font-weight:700;font-size:22px;line-height:1}
.act .ic{width:28px;height:28px}
.act[data-act="journal"]{--wash:var(--w-peach)}
.act[data-act="feed"]{--wash:var(--w-peach)} .act[data-act="play"]{--wash:var(--w-yellow)} .act[data-act="walk"]{--wash:var(--w-mint)} .act[data-act="care"]{--wash:var(--w-blue)}
.act[data-act="shop"]{--wash:var(--w-pink)} .act[data-act="wardrobe"]{--wash:var(--w-lilac)} .act[data-act="map"]{--wash:var(--w-mint)} .act[data-act="home"]{--wash:var(--w-cream)}
.act:nth-child(odd){transform:rotate(-1.3deg)}
.act:nth-child(even){transform:rotate(1.1deg)}
.act.on{box-shadow:inset 0 -5px 0 -1px rgba(242,143,165,.55);transform:translateY(-3px) rotate(-1deg)}
.act.on::after{content:"";position:absolute}

/* ---------- buttons, cards ---------- */
.btn{min-height:46px;padding:7px 18px 8px;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;--wash:var(--paper)}
.btn.big{font-family:var(--font-hand);font-weight:700;font-size:28px;padding:8px 26px 10px}
.btn.yes{--wash:var(--w-yellow)} .btn.go{--wash:var(--w-mint)} .btn.no{--wash:var(--paper)} .btn.red{--wash:var(--w-pink)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn .ic{width:24px;height:24px}
.card{flex:none;width:132px;padding:10px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:16px;line-height:1.15;position:relative;touch-action:pan-x;--wash:var(--paper)}
.card:nth-child(3n){transform:rotate(1.2deg)}
.card:nth-child(3n+1){transform:rotate(-1deg)}
.card .art{width:58px;height:58px}
.card .art svg{width:100%;height:100%}
.card b{font-weight:700;font-family:var(--font-hand);font-size:22px;line-height:1}
.card .cnt{position:absolute;right:4px;top:2px;--wash:var(--w-yellow);background:var(--fr-round) 0 0/100% 100% no-repeat,var(--w-yellow);border-radius:50%;min-width:30px;height:30px;display:grid;place-items:center;font-size:16px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 12px 3px;font-size:16px;--wash:var(--paper)}
.chip.lock{--wash:var(--w-peach)}
.chip.own{--wash:var(--w-mint)}
.small{font-size:16px;color:var(--muted)}
.ghost{position:fixed;z-index:50;width:70px;height:70px;pointer-events:none;transform:translate(-50%,-50%) rotate(-8deg)}
.ghost svg{width:100%;height:100%}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:20;background:rgba(91,61,50,.32);display:flex;align-items:center;justify-content:center;padding:22px}
.panel{position:relative;width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;padding:20px 24px 18px;transform:rotate(-.5deg);--wash:var(--paper);
  filter:drop-shadow(0 8px 14px rgba(60,40,25,.25))}
.panel.shop{width:min(900px,100%)}
html.pa-panel .panel.celebrate{background:var(--panelart) 0 0/100% 100% no-repeat;--fr:none}
html.pa-panel .panel.celebrate::before{display:none}
.panel.pop{animation:panelPop .3s ease-out}
@keyframes panelPop{from{transform:scale(.85) rotate(-3deg);opacity:.3}}
.panel h2{margin:0 52px 8px 0;font-family:var(--font-hand);font-weight:700;font-size:40px;line-height:1.05;text-wrap:balance}
.panel h2 .hl{background:linear-gradient(transparent 55%,rgba(242,143,165,.45) 55% 88%,transparent 88%)}
.panel .x{position:absolute;right:14px;top:14px}
.panel-body{overflow:auto;min-height:0;padding:2px}
.panel p{margin:6px 0;line-height:1.35}
.foot{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.confirm{position:absolute;left:16px;right:16px;bottom:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;z-index:3;--wash:var(--w-yellow)}
.confirm p{flex:1 1 220px;margin:0;font-size:18px}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:18px 16px;padding:12px 4px 84px}
.sitem{position:relative;padding:14px 10px 12px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;--wash:var(--paper)}
.sitem .art{width:70px;height:70px}
.sitem .art svg{width:100%;height:100%}
.sitem .art.house{width:130px;height:108px}
.sitem b{font-family:var(--font-hand);font-weight:700;font-size:24px;line-height:1}
.sitem .desc{font-size:16px;line-height:1.2;flex:1}
.price{display:flex;align-items:center;gap:4px;font-size:19px;font-variant-numeric:tabular-nums}
.price .ic{width:24px;height:24px}
.sitem.lockd{--wash:#F3ECE1}
.sitem.lockd .art{filter:grayscale(.85) opacity(.55)}
.tabs{display:flex;gap:10px;margin:2px 0 4px}
.tabs .btn{font-family:var(--font-hand);font-weight:700;font-size:24px;padding:4px 20px 6px}
.tabs .btn[aria-selected="true"]{--wash:var(--w-yellow);transform:translateY(-2px) rotate(-1deg)}
.ward{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
.ward .preview{position:relative;padding:10px;background:var(--fr-card) 0 0/100% 100% no-repeat,var(--hatch) var(--ins),linear-gradient(var(--w-blue),var(--w-blue)) var(--ins)}
.ward .preview svg{width:100%;display:block}
.slot{margin-bottom:10px}
.slot h4{margin:0 0 4px;font-family:var(--font-hand);font-weight:700;font-size:25px}
.opt{min-height:46px;padding:4px 12px;font-size:17px;display:inline-flex;align-items:center;gap:5px;margin:0 8px 8px 0;--wash:var(--paper)}
.opt[aria-pressed="true"]{--wash:var(--w-yellow)}
.opt .ic{width:28px;height:28px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin:10px 0}
.res{padding:8px 10px 10px;text-align:center;--wash:var(--w-cream)}
.res:nth-child(1){--wash:var(--w-yellow)} .res:nth-child(2){--wash:var(--w-pink)} .res:nth-child(3){--wash:var(--w-lilac)} .res:nth-child(4){--wash:var(--w-blue)} .res:nth-child(5){--wash:var(--w-mint)}
.res .v{font-size:30px;font-variant-numeric:tabular-nums;font-family:var(--font-read);line-height:1.1}
.res .k{font-size:16px;color:var(--muted)}
.haul{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.haul span{display:inline-flex;align-items:center;gap:3px;font-size:17px}
.haul svg{width:34px;height:34px}
.unlocks{margin:6px 0;padding-left:0;list-style:none;line-height:1.55;font-size:18px}
.unlocks li::before{content:"\2726  ";color:var(--pink)}
.namebox{width:100%;font-size:34px;font-family:var(--font-hand);font-weight:700;padding:6px 16px;color:var(--ink);--wash:var(--paper)}
.namebox:focus{outline:none;--wash:var(--w-yellow)}
.lu-doodle{display:block;width:100%;height:44px;margin:-4px 0 2px}

/* ---------- v1.1: journal, stamps, treasure, nose-o-meter ---------- */
.namewrap{display:flex;flex-direction:column;min-width:0;line-height:1}
#hudTitle{font-family:var(--font-hand);font-weight:700;font-size:17px;color:#B07A12;white-space:nowrap}
.tstar{color:#C9971C}
.charmtag{font-family:var(--font-hand);font-weight:700;font-size:20px;text-align:center;margin-top:4px}
.panel.journal{width:min(1080px,100%);--wash:#FFF8EA}
.jtop{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:center;margin:4px 0 10px}
.jprog b{font-size:34px;font-family:var(--font-read);margin-right:8px}
.jmap{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.jmap-art{width:240px;height:160px}
.jmap-art svg{width:100%;height:100%}
.small-map{width:180px;height:120px}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:16px 14px;padding:8px 4px 12px}
.jent{position:relative;padding:12px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;--fr:var(--fr-card);border-radius:13px 9px 15px 8px;
  background:var(--fr) 0 0/100% 100% no-repeat,var(--hatch) var(--ins),linear-gradient(var(--wash),var(--wash)) var(--ins);--wash:var(--paper)}
.jent .art{width:72px;height:72px}
.jent .art svg{width:100%;height:100%}
.jent > b{font-family:var(--font-hand);font-weight:700;font-size:23px;line-height:1}
.jent .ab{font-size:15.5px;line-height:1.2;flex:1}
.jent .btn{min-height:40px;padding:4px 14px 5px;font-size:17px}
.jent.unk{--wash:#F6F0E6}
.jent.unk .art{filter:brightness(0) opacity(.16)}
.jent.unk > b{color:var(--graph);font-size:28px;letter-spacing:3px}
.stamp{display:inline-block;font-family:var(--font-hand);font-weight:700;font-size:16px;letter-spacing:1.6px;text-transform:uppercase;padding:0 9px;line-height:1.35;
  border:2.5px solid currentColor;border-radius:8px 4px 9px 5px;transform:rotate(-6deg);box-shadow:0 0 0 1.5px var(--paper),0 0 0 3px currentColor;opacity:.88;margin:4px 0 2px}
.stamp.r0{color:#8C8580}.stamp.r1{color:#4C9A5A}.stamp.r2{color:#3F76C0}.stamp.r3{color:#C08A12;background:rgba(255,227,161,.35)}
.stamp.r3::before,.stamp.r3::after{content:"\2726";margin:0 3px;font-size:13px}
.tfind{display:grid;grid-template-columns:180px minmax(0,1fr);gap:18px;align-items:center;margin:6px 0 4px}
.tbig{width:180px;height:180px;position:relative;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(255,227,161,.9),rgba(255,227,161,0) 68%)}
.tbig svg{width:150px;height:150px}
.tfind h3{margin:0;font-family:var(--font-hand);font-weight:700;font-size:34px;line-height:1}
.tfind .ab{font-size:18px;line-height:1.3;margin:6px 0}
.results.compact{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.results.compact .res .v{font-size:22px}
.nose{display:flex;align-items:center;gap:8px;min-width:250px;flex:1 1 250px}
.nose .ic{width:34px;height:34px}
.nose .prog i{transition:width .2s,background .3s}
.nose .lbl{font-family:var(--font-hand);font-weight:700;font-size:24px;min-width:62px}
.nose.cold .lbl{color:#3F76C0}.nose.cold .prog i{background:repeating-linear-gradient(-62deg,#86B3EA 0 2.2px,#cfe0f6 2.2px 4.4px)}
.nose.warm .lbl{color:#D07A2E}.nose.warm .prog i{background:repeating-linear-gradient(-62deg,#F4A262 0 2.2px,#fbd9bd 2.2px 4.4px)}
.nose.hot .lbl{color:#C9475E;animation:noseWig .25s ease-in-out infinite alternate}.nose.hot .prog i{background:repeating-linear-gradient(-62deg,#E2574C 0 2.2px,#f6b9b2 2.2px 4.4px)}
.nose.hot .lbl::after{content:" ~~";letter-spacing:-2px}
@keyframes noseWig{from{transform:rotate(-4deg)}to{transform:rotate(4deg) translateY(-1px)}}
.digs{font-family:var(--font-hand);font-weight:700;font-size:24px;white-space:nowrap}
.walkbag{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- toasts: sticky notes ---------- */
#toasts{position:absolute;left:50%;top:76px;transform:translateX(-50%);z-index:15;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;width:min(80%,520px)}
.toast{position:relative;padding:8px 18px 9px;font-size:18px;text-align:center;animation:toastIn .25s ease-out;--wash:var(--paper);filter:drop-shadow(0 3px 4px rgba(60,40,25,.18))}
.toast.good{--wash:var(--w-mint)}.toast.bad{--wash:var(--w-pink)}.toast.gold{--wash:var(--w-yellow)}
@keyframes toastIn{from{transform:translateY(-10px) rotate(-3deg);opacity:0}}

/* ---------- title: sketchbook cover ---------- */
#title{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(var(--dot) 1.1px,transparent 1.6px) 0 0/22px 22px,var(--paper)}
#title .bg{position:absolute;inset:0;opacity:.32;filter:saturate(.8)}
#title .bg svg{width:100%;height:100%}
.cover{position:relative;width:min(64%,860px);height:78%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 40px 30px 76px;--wash:#FFF8EA;transform:rotate(-1deg);filter:drop-shadow(0 10px 18px rgba(60,40,25,.25))}
.cover::before{left:auto;right:-20px;top:20px;transform:rotate(38deg)}
.cover::after{left:-6px;top:auto;bottom:16px;transform:rotate(-34deg);filter:hue-rotate(150deg)}
.cover .rings{position:absolute;left:14px;top:6%;bottom:6%;width:44px}
.cover .rings svg{width:100%;height:100%}
.cover .doodles{position:absolute;inset:0;pointer-events:none}
.cover .doodles svg{width:100%;height:100%}
.logo{position:relative;margin:0;font-family:var(--font-hand);font-weight:700;font-size:clamp(70px,11vmin,132px);line-height:.9;color:var(--ink);letter-spacing:1px;text-align:center}
.logo span{display:inline-block}
.logo::after{content:"";position:absolute;left:4%;right:2%;bottom:6%;height:26%;background:var(--pink);opacity:.4;z-index:-1;border-radius:40% 60% 50% 45%/60% 40% 55% 45%;transform:rotate(-1.5deg)}
.tagline{position:relative;font-family:var(--font-hand);font-size:30px;font-weight:600;color:var(--ink)}
.tbtns{position:relative;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.crayon-note{position:relative;font-family:var(--font-read);font-size:17px;color:var(--muted);transform:rotate(-1.5deg)}
#title .tdog{position:absolute;bottom:2%;right:4%;width:min(24%,280px);z-index:3}
#title .tdog2{position:absolute;bottom:2%;left:2%;width:min(22%,250px);z-index:3}
.adopt-card{display:flex;gap:14px;align-items:center}
.adopt-card .info{flex:1;min-width:0}
.adopt-card h3{margin:0;font-family:var(--font-hand);font-weight:700;font-size:36px;line-height:1}
.adopt-card h3 .small{font-family:var(--font-read);font-size:18px;font-weight:normal}
.adopt-card p{margin:2px 0;font-size:17px;line-height:1.25}
.arrow{width:52px;height:52px;font-size:30px;font-family:var(--font-hand);font-weight:700;flex:none;--wash:var(--w-yellow);--fr:var(--fr-round)}
.heads{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:330px;margin:0 auto}
.heads button{width:54px;height:54px;padding:5px;overflow:hidden;--wash:var(--paper)}
.heads button[aria-current="true"]{--wash:var(--w-yellow);transform:scale(1.12) rotate(-5deg)}
.heads svg{width:100%;height:100%;display:block}
.prog{height:20px;position:relative;flex:1}
.prog::after{content:"";position:absolute;inset:0;background:var(--fr-tubew) 0 0/100% 100% no-repeat;pointer-events:none}
.prog i{position:absolute;left:4px;top:4px;bottom:4px;width:0;max-width:calc(100% - 7px);border-radius:7px 3px 8px 4px;background:repeating-linear-gradient(-62deg,#9ccf8f 0 2.2px,#cde8c4 2.2px 4.4px)}
.walkctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.holdbtn{flex:1 1 200px;min-height:58px;font-family:var(--font-hand);font-weight:700;font-size:28px;--wash:var(--w-mint);touch-action:none}
.holdbtn.down{--wash:var(--w-yellow);transform:translate(1px,2px)}
label.tog{display:inline-flex;align-items:center;gap:8px;font-size:17px;min-height:44px}
label.tog input{width:22px;height:22px;accent-color:#e07a92}
#modHost{position:absolute;left:0;right:0;bottom:0;top:62px;z-index:8;overflow:hidden;background:var(--paper)}
#devPanel{position:absolute;right:14px;bottom:calc(var(--barH) + 18px);z-index:25;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:15px;max-height:calc(100% - var(--barH) - 40px);overflow:auto;--wash:var(--w-lilac)}
#devPanel .btn{padding:6px 10px;font-size:15px}
#devPanel b{font-family:var(--font-hand);font-size:24px;grid-column:1/-1}
#devPanel #dvX{grid-column:1/-1}
.trickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.trickgrid .btn{flex-direction:column;gap:0;line-height:1.05;font-family:var(--font-hand);font-weight:700;font-size:22px;padding:5px 8px 7px;--wash:var(--w-yellow)}
.trickgrid .btn[aria-disabled="true"]{--wash:var(--paper)}
.trickgrid .btn small{font-family:var(--font-read);font-weight:normal;font-size:15px;color:var(--muted)}

/* phone layout from v1 (not extended, not tested in v2) */
@media (max-aspect-ratio: 4/5){
  html:not([data-layout="phone"]) #stage{width:100%;height:100%;aspect-ratio:auto;max-height:none}
  html:not([data-layout="phone"]) #hud{flex-wrap:wrap;row-gap:4px;padding:6px 10px 12px}
  html:not([data-layout="phone"]) #hudName{display:none}
  html:not([data-layout="phone"]) .bond{order:2;flex:1;min-width:0} html:not([data-layout="phone"]) .bond .track{flex:1;width:auto}
  html:not([data-layout="phone"]) .coins{order:3} html:not([data-layout="phone"]) #muteBtn{order:4} html:not([data-layout="phone"]) #gearBtn{order:5}
  html:not([data-layout="phone"]) .meters{order:6;flex-basis:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}

  html:not([data-layout="phone"]) .row{flex-wrap:wrap;overflow:visible}
  html:not([data-layout="phone"]) .card{width:100px}

  html:not([data-layout="phone"]) .act{flex-direction:column;font-size:18px;gap:0}
  html:not([data-layout="phone"]) .cover{width:92%;padding:24px 20px 24px 56px}
}

/* ---------- v1.5A purchase window ---------- */
.buyveil{position:absolute;inset:0;z-index:6;background:rgba(91,61,50,.28);display:flex;align-items:center;justify-content:center;border-radius:inherit}
.buybox{position:relative;width:min(480px,92%);padding:18px 22px 16px;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px 10px 18px 11px;box-shadow:3px 5px 0 rgba(91,61,50,.22);transform:rotate(-.4deg)}

.bb-m,.bb-p{font-size:26px;width:44px}

.bb-quick{display:flex;gap:6px;margin-left:auto}
.bb-in::-webkit-outer-spin-button,.bb-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.bb-in{-moz-appearance:textfield;appearance:textfield}
.bb-quick .btn[aria-pressed="true"]{--wash:var(--w-yellow)}
.bb-one{margin:12px 0 4px}

/* ---------- v1.5 pack ---------- */
#hudMood{position:relative;left:-14px;top:16px;margin-right:-10px}
.mood{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#7CC47F;flex:none}
.mood.amber{background:#F5B942} .mood.red{background:#E2574C}
#hudPack{display:flex;gap:6px;margin-left:4px}
.dchip{position:relative;width:42px;height:42px;padding:3px;border:2px solid var(--ink);border-radius:50% 46% 52% 48%;background:var(--paper);cursor:pointer}
.dchip svg{width:100%;height:100%;display:block}
.dchip .mood{position:absolute;right:-3px;bottom:-2px;width:11px;height:11px}
.dchip .dsx{position:absolute;left:-4px;top:-6px;font-size:13px;font-weight:700;color:var(--ink)}

html[data-layout="phone"] .toast{font-size:16px}
html[data-layout="phone"] #devPanel{left:8px;right:8px;bottom:calc(var(--barH) + 8px);max-height:60%}
html[data-layout="phone"] #devPanel .btn{min-height:44px}
/* walk carousel */
html[data-layout="phone"] .rt-card{width:calc(100vw - 48px)}
html[data-layout="phone"] .rt-prev{height:200px}
html[data-layout="phone"] .rt-title{font-size:32px}
html[data-layout="phone"] .rt-foot{flex-wrap:wrap;justify-content:center}
/* map */
html[data-layout="phone"] #mapScroll{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;touch-action:pan-x pan-y;scrollbar-width:none}
html[data-layout="phone"] #mapScroll::-webkit-scrollbar{display:none}
html[data-layout="phone"] #mapScroll > svg.world{display:block;height:100%;width:auto;aspect-ratio:1000/600;touch-action:pan-x pan-y}
html[data-layout="phone"] #mapGo{display:flex;position:absolute;left:12px;right:12px;bottom:14px;z-index:7;gap:10px;align-items:center;justify-content:center;padding:10px;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px 11px 17px 10px;box-shadow:3px 4px 0 rgba(91,61,50,.25);font-size:17px}
html[data-layout="phone"] #mapGo[hidden]{display:none}
html[data-layout="phone"] #mapGo .btn{min-height:48px}
html[data-layout="phone"] #mapX{right:10px;top:10px}
/* title, adopt, on-the-way */
html[data-layout="phone"] .cover{width:92%;height:auto;max-height:92%;padding:24px 16px 24px 58px;transform:none}
html[data-layout="phone"] #stage.flowdock #view{flex:0 0 40%}
html[data-layout="phone"] #stage.flowdock #dock{flex:1 1 auto;max-height:none;overflow-y:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
html[data-layout="phone"] #stage.flowdock .tray{max-height:none}
html[data-layout="phone"] .tray-h h3{font-size:26px}
html[data-layout="phone"] .adopt-card h3{font-size:30px}
html[data-layout="phone"] .adopt-card .arrow{width:48px;height:48px;flex:none}
html[data-layout="phone"] .adopt-card{flex-wrap:wrap}
html[data-layout="phone"] .onway-card{width:calc(100% - 32px)}
</style>

<div id="stage" aria-label="Paw Haven game">
  <header id="hud" hidden>
    <div class="who"><span class="portrait" id="hudHead"></span><i id="hudMood" class="mood green"></i><span class="namewrap"><span id="hudName">Dog</span><span id="hudClock" hidden></span><span id="hudTitle" hidden></span></span><span id="hudPack"></span></div>
    <div class="meters" id="meters"></div>

    <button id="gearBtn" class="iconbtn" aria-label="Settings"></button>
    <button id="moreBtn" class="iconbtn" aria-label="Menu: settings and sound">&#8943;</button>
  </header>
  <main id="view"></main>
  <aside id="trainPanel" hidden aria-label="Trick training"></aside>
  <section id="dock" aria-live="polite"></section>
  <nav id="bar" hidden aria-label="Actions"></nav>
  <div id="toasts" aria-live="polite"></div>
  <div id="bubble" hidden></div>
  <div id="title"></div>
  <div id="modal" hidden></div>
  <div id="devPanel" hidden></div>
  <div id="modHost" hidden></div>
</div>

const fmtC = (n) => Math.round(n).toLocaleString('en-US');
let buyOpen = false;
function buyWindow(panel, o) {
  // o: { art, name, desc, price, stack, owned, have, haveLabel, sell, max }  -> Promise<qty | 0>
  return new Promise((res) => {
    const old = panel.querySelector('.buyveil'); if (old) old.remove();
    const sell = !!o.sell, unit = o.price;
    const maxQ = () => (sell ? o.max : o.stack ? Math.max(0, Math.min(999, Math.floor(S.coins / unit))) : 1);
    let q = o.stack || sell ? Math.min(1, Math.max(0, maxQ())) || 1 : 1;
    const v = document.createElement('div'); v.className = 'buyveil';
    v.innerHTML = `<div class="buybox pop" role="dialog" aria-modal="true" aria-label="${sell ? 'Sell' : 'Buy'} ${esc(o.name)}">
      <div class="bb-top"><span class="bb-art">${o.art}</span><div><h3>${esc(o.name)}</h3><p class="small">${esc(o.desc || '')}</p><p class="bb-unit">${priceHTML(fmtC(unit) + ' each')}</p></div></div>
      ${o.stack || sell ? `<div class="bb-qty"><button class="btn bb-m" aria-label="One less">−</button><input class="bb-in" type="number" min="1" inputmode="numeric" aria-label="Quantity" value="${q}"><button class="btn bb-p" aria-label="One more">+</button>
        <span class="bb-quick">${[1, 5, 10].map((n) => `<button class="btn" data-qq="${n}">×${n}</button>`).join('')}<button class="btn" data-qq="max">Max</button></span></div>` : `<p class="bb-one">${o.owned ? '<span class="chip own">Owned</span> You already have this one.' : 'One of a kind: quantity 1.'}</p>`}
      <div class="bb-sum"></div>
      <div class="foot"><button class="btn no bb-no">Cancel</button><button class="btn yes big bb-yes">${sell ? 'Sell' : 'Buy'}</button></div></div>`;
    panel.appendChild(v); buyOpen = true;
    const inp = v.querySelector('.bb-in'), yes = v.querySelector('.bb-yes'), sum = v.querySelector('.bb-sum');
    const draw = () => {
      const mx = maxQ(); if (o.stack || sell) q = clamp(Math.round(+q || 1), 1, Math.max(1, sell ? mx : 999));
      const total = unit * q, after = sell ? S.coins + total : S.coins - total, bad = !sell && (after < 0 || (!o.stack && o.owned));
      if (inp && document.activeElement !== inp) inp.value = q;
      sum.className = 'bb-sum' + (bad ? ' bad' : '');
      sum.innerHTML = `<div>You have <b>${fmtC(S.coins)}</b> coins</div><div>Total: <b>${fmtC(total)}</b> coins</div><div class="bb-after">${sell ? 'Coins after' : 'Coins left after'}: <b>${fmtC(after)}</b></div><div class="small">${esc(o.haveLabel || 'In bag')}: ${o.have || 0}${sell ? '' : o.stack ? ` · you can afford ${mx}` : ''}</div>${bad && !o.owned ? `<div class="bb-warn">Not enough coins. Have you tried being rich?</div>` : ''}`;
      yes.disabled = bad; yes.setAttribute('aria-disabled', bad ? 'true' : 'false');
      v.querySelectorAll('[data-qq]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.qq === String(q) || (b.dataset.qq === 'max' && q === mx))));
    };
    const step = (d) => { q = (+q || 1) + d; SFX.click(); draw(); };
    const done = (val) => { window.removeEventListener('keydown', onKey, true); v.remove(); buyOpen = false; res(val); };
    const doBuy = () => { if (yes.disabled) { SFX.nope(); return; } done(q); };
    const onKey = (e) => {
      if (!v.isConnected) { window.removeEventListener('keydown', onKey, true); buyOpen = false; return; }
      const k = e.key; let used = true;
      if (k === 'Escape') { SFX.click(); done(0); }
      else if (k === 'Enter') doBuy();
      else if ((k === 'ArrowLeft' || k === '-' || k === '_') && (o.stack || sell)) step(-1);
      else if ((k === 'ArrowRight' || k === '+' || k === '=') && (o.stack || sell)) step(1);
      else used = false;
      if (used) { e.preventDefault(); e.stopImmediatePropagation(); }
    };
    window.addEventListener('keydown', onKey, true);
    v.addEventListener('click', (e) => { if (e.target === v) { SFX.click(); done(0); } });
    v.querySelector('.bb-no').onclick = () => { SFX.click(); done(0); };
    yes.onclick = doBuy;
    if (inp) { v.querySelector('.bb-m').onclick = () => step(-1); v.querySelector('.bb-p').onclick = () => step(1); inp.addEventListener('input', () => { q = inp.value; draw(); }); inp.addEventListener('change', () => { q = inp.value; draw(); inp.value = q; }); }
    v.querySelectorAll('[data-qq]').forEach((b) => { b.onclick = () => { SFX.click(); q = b.dataset.qq === 'max' ? Math.max(1, maxQ()) : +b.dataset.qq; draw(); }; });
    draw(); setTimeout(() => { try { (inp || yes).focus({ preventScroll: true }); if (inp) inp.select(); } catch (e) { /* none */ } }, 30);
  });
}

/* camera: crop the 1000x600 hub scene around the dog (x ~ 430) so the full height stays visible */

  const svg = $('#view > svg.world'); if (!svg) return;

}

}
function setMotion(on) { document.documentElement.dataset.motion = on ? 'on' : 'off'; prefs.motion = on ? 'on' : 'off'; savePrefs(); }

/* ======================= TIME LOOP ======================= */
function applyAway() {
  if (!S) return; const secs = clamp((Date.now() - (S.lastReal || Date.now())) / 1000, 0, 7 * 86400); const hrs = secs / 60;
  if (secs < 5) return;
  S.gameMin += secs;
  const fl = (v, rate, floor) => (v > floor ? Math.max(floor, v - rate * hrs) : v);
  S.dogs.forEach((d) => { const s = d.stats; s.hunger = fl(s.hunger, 3, 30); s.happy = fl(s.happy, 2, 40); s.clean = fl(s.clean, 1, 40); s.energy = clamp(s.energy + 20 * hrs, 0, 100); });
  S.lastReal = Date.now(); dailyCheck(); markDirty();
  if (secs > 120) setTimeout(() => toast(`While you were away, ${NAME()} napped for ${Math.round(hrs)} game hours and missed you a normal amount.`, 'gold'), 800);
}
let lastTick = performance.now(), saveClock = 0, voiceClock = 0;
function tick() {
  const now = performance.now(), dt = Math.min(5, (now - lastTick) / 1000); lastTick = now;
  if (!S || !['yard', 'market', 'map', 'shelter', 'walk', 'fetch', 'bath', 'toy'].includes(cur.mode)) return;
  S.gameMin += dt; const h = dt / 60;
  const wasDay = S.daily.day; if (dailyCheck() && wasDay) toast(`Day ${day()} begins. Daily bonuses reset.`, 'gold');
  checkEnv();
  addStat('hunger', -6 * h * (S.dog.key === 'corgi' ? 1.2 : 1));
  const pack = S.dogs.length > 1 ? 0.75 : 1;
  addStat('happy', -houseInfo().hd * h * (buffOn('warm') ? 0.5 : 1) * pack * (fluffyOn() ? 0.5 : 1));
  others().forEach((d) => { const st = d.stats, c = (k, v) => { st[k] = clamp(st[k] + v, 0, 100); }; c('hunger', -6 * h * (d.key === 'corgi' ? 1.2 : 1)); c('happy', -houseInfo().hd * h * pack * (fluffyOn(d) ? 0.5 : 1)); c('clean', -3 * h); if (d.sleeping) { c('energy', napRate() * h); if (st.energy >= 100) { d.sleeping = false; if (cur.mode === 'yard') redrawPackDog(d); } } else c('energy', -2 * h); });
  buffTick();
  pottyTick();
  if (Date.now() - lastGardenTick > 60000) { lastGardenTick = Date.now(); gardenAdvance(); birthdayCheck(); }
  addStat('clean', -3 * h);
  if (S.gameMin < (S.glowUntil || -1) && S.stats.happy < 80) S.stats.happy = 80;
  if (S.sleeping) {
    addStat('energy', napRate() * h); const nb = $('#napBar'); if (nb) nb.style.width = S.stats.energy + '%';
    if (S.stats.energy >= 100) wake(true);
  } else if (cur.mode !== 'walk' && cur.mode !== 'toy') addStat('energy', -2 * h);
  idleTick(); packIdleTick(); if ((voiceClock += dt) >= 1) { voiceClock = 0; voiceTick(); }
  if (cur.mode === 'yard' && !busy && $('#dogArt')) renderDog(dogPoseNow(), IDLE.act ? IDLE.act.facing : 'right');
  updateHUD();
  saveClock += dt; if (saveClock > 3 && dirty) { saveClock = 0; saveNow(); }
}
