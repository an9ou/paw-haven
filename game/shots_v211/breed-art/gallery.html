<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>v2.11 breed art</title>
<!-- BREED ART lane review page: ?view=breeds (akita, spitz, pom in every pose and age next to shiba and samoyed),
     ?view=bandanas (the three Tokyo bandanas on all 17 breeds), ?view=extra (coats, mixes, sparkle, outfits on the new breeds).
     &k=akita limits the breeds, &age=puppy|newborn the age. -->
<style>body{background:#FFF8EC;margin:0;padding:8px 16px;font:13px/1.3 sans-serif;color:#2E2320}h2{font-size:15px;margin:10px 0 2px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:2px}.g div{text-align:center;font-size:11px}.g svg{width:100%;height:auto;display:block}
.hd svg{width:70%;margin:auto}</style></head><body>
<script src="../../../dogs/pawart_dogs.js"></script>
<div id="o"></div>
<script>
const q=new URLSearchParams(location.search),view=q.get('view')||'breeds',P=PawArt;
const POSES=['idle','happy','pet','eat','sleep','walk','jump','sit','sad','dirty','crouch','shake','cold','hot','dig','beg','squat','leglift','paw','down','rollover','playdead','speak','dance','bow','scratch','sniff','yawn','howl'];
const cell=(svg,lab,cls)=>`<div class="${cls||''}">${svg}<br>${lab}</div>`;
let h='';
if(view==='breeds'){
  const keys=(q.get('k')||'shiba,akita,samoyed,spitz,pom').split(','),ages=q.get('age')?[q.get('age')]:[null,'puppy','newborn'],poses=(q.get('p')||POSES.join(',')).split(',');
  keys.forEach(k=>ages.forEach(age=>{h+=`<h2>${k} ${age||'adult'}</h2><div class="g">`+cell(P.dogHead(k,{age:age||undefined}),'head','hd')+poses.map(p=>cell(P.dog(k,{pose:p,anim:false,age:age||undefined}),p)).join('')+'</div>'}));
}else if(view==='bandanas'){
  const keys=(q.get('k')||P.DOGS.map(d=>d.key).join(',')).split(','),B=['Shibuya Bandana','Asakusa Bandana','Tokyo Tower Bandana'],poses=(q.get('p')||'idle').split(',');
  B.forEach(b=>{h+=`<h2>${b}</h2><div class="g">`+keys.map(k=>poses.map(p=>cell(P.dog(k,{pose:p,anim:false,outfit:{neck:b},age:q.get('age')||undefined}),k+' '+p)).join('')).join('')+'</div>'});
}else{
  const keys=(q.get('k')||'akita,spitz,pom').split(',');
  const C={akita:[['Red',null],['Sesame',{base:'#D46E36',light:'#FFF4E2',dark:'#3A2E2E'}],['White',{base:'#FBF6EC',light:'#FFFFFF',dark:'#E8DECB'}]],
    spitz:[['White',null],['Cream',{base:'#F4E8D0',light:'#FFFAF0',dark:'#DCCBA8'}]],
    pom:[['Orange',null],['Cream',{base:'#F4DDB0',light:'#FFF4E0',dark:'#D6B884'}],['Black',{base:'#2B2430',light:'#4A3F4E',dark:'#1D1A22'}],['Chocolate',{base:'#7A4A2E',light:'#9A6A4A',dark:'#5A3420'}],['White',{base:'#FBF6EC',light:'#FFFFFF',dark:'#E8DECB'}],['Blue',{base:'#8A96A8',light:'#A9B4C4',dark:'#55657A'}],['Parti',{base:'#F59A3C',light:'#FFD9A6',dark:'#C9701E',white:.7}]]};
  keys.forEach(k=>{h+=`<h2>${k} coats, mixes, sparkle, outfits</h2><div class="g">`;
    C[k].forEach(([n,c])=>{h+=cell(P.dog(k,{pose:'idle',anim:false,coat:c||undefined,seed:'g1'}),n)+cell(P.dogHead(k,{coat:c||undefined}),n+' head','hd')});
    ['shiba','samoyed','chihuahua'].forEach(o=>{h+=cell(P.dog(k,{pose:'idle',anim:false,mix:{head:o}}),'body '+k+', head '+o)+cell(P.dog(o,{pose:'idle',anim:false,mix:{head:k}}),'body '+o+', head '+k)});
    h+=cell(P.dog(k,{pose:'idle',anim:false,sparkle:true}),'sparkle')+cell(P.dog(k,{pose:'sit',anim:false,expecting:true}),'expecting')+cell(P.dog(k,{pose:'walk',anim:false,facing:'left'}),'facing left');
    [{head:'Party Hat',neck:'Red Bandana'},{body:'Yellow Raincoat',head:'Rain Hat'},{body:'Superhero Cape',eyes:'Heart Sunglasses'},{head:'Wizard Hat',body:'Happi Coat'},{body:'Tutu',head:'Flower Crown'},{body:'Ghost Sheet'},{head:'Astronaut Helmet'},{body:'Very Ugly Sweater',head:'Reindeer Antlers'},{head:'Year of the Sheep Hood',neck:'Snowflake Snood'},{body:'Bat Wings',neck:'Candy Corn Bandana'},{body:'Cozy Hoodie',neck:'Tokyo Tower Bandana'},{body:'Pumpkin Suit',head:'Witch Hat'}].forEach((o,i)=>{h+=cell(P.dog(k,{pose:['idle','walk','sit','happy','idle','idle','idle','walk','sit','idle','idle','idle'][i],anim:false,outfit:o}),Object.values(o).join(', '))});
    h+='</div>'});
}
document.getElementById('o').innerHTML=h;
</script></body></html>
